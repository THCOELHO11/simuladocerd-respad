  const panel = panelShell(view, 'Fase 02 — Chegada ao Local', 'Reconhecimento');
  panel.innerHTML += `
    <p>A guarnição chega à Rua A. A cena está tomada por aproximadamente <strong>30 pessoas</strong> entre os escombros, tentando — sem êxito — retirar a coluna que prende o jovem. A rua, estreita, está congestionada por <strong>viaturas de imprensa, duas viaturas do SAMU e carros de vizinhos</strong>.</p>
  `;
  const gallery = document.createElement('div'); gallery.className='scene-gallery';
  gallery.innerHTML = `
    <div class="scene-img-card">${sceneImageFrontSVG()}<div class="scene-img-cap">Fachada do conjunto geminado — casa central colapsada, laterais com risco</div></div>
    <div class="scene-img-card">${sceneImageStreetSVG()}<div class="scene-img-cap">Cena vista da rua — aglomeração, viaturas, vítimas visíveis</div></div>
  `;
  panel.appendChild(gallery);
  panel.innerHTML += `
    <div class="readout">
      <span class="rk">Companhia da Serra — já no local</span>
      Guarnição composta por <strong>Sgt Adilson, Cb Sebastião, Cb Tadeu e Sd Julio</strong>. Chegaram há cerca de 5 minutos; ainda não possuem informações consolidadas sobre a cena.
    </div>
    <p>Selecione um <strong>militar disponível</strong> e, em seguida, a <strong>ação</strong> que ele irá executar. Cada ação consome tempo real — o militar só estará disponível novamente após concluí-la.</p>
  `;

  let selectedId = null;
  let riskShown = false;
  const milOpts = { selectable:true, onSelect:(id)=>{ selectedId = id; drawAllRef(); } };
  const splitOpts = { militaresOpts: milOpts };
  let drawAllRef = ()=>{};

  const { left, right } = splitScreen(panel, (leftEl)=>{
    const hint = document.createElement('div');
    leftEl.appendChild(hint);

    const riskBox = document.createElement('div');
    leftEl.appendChild(riskBox);

    const list = document.createElement('div'); list.className='action-list';
    leftEl.appendChild(list);

    const teamAction = document.createElement('button');
    teamAction.className = 'action-btn';
    leftEl.appendChild(teamAction);

    const feed = document.createElement('div'); feed.className='feed';
    leftEl.appendChild(feed);

    const resourceCard = document.createElement('div'); resourceCard.className='side-card'; resourceCard.style.marginTop='18px';
    resourceCard.innerHTML = `<h3>&#128225; Acionamento de Recursos Extras</h3>`;
    const resourceRow = document.createElement('div'); resourceRow.className='resource-row';
    resourceCard.appendChild(resourceRow);
    leftEl.appendChild(resourceCard);

    function drawResources(){
      resourceRow.innerHTML = '';
      const defs = [
        {key:'k9', title:'K9 — Lenke e Alex', sub:'Equipe canina de busca'},
        {key:'reforco', title:'Reforço — Sgt Adair', sub:'Efetivo adicional'},
        {key:'logistica', title:'Logística — Sgt Milholo', sub:'Suporte logístico'},
      ];
      defs.forEach(d=>{
        const r = state.recursos[d.key];
        const btn = document.createElement('button');
        btn.className = 'resource-btn' + (r.acionado ? ' on' : '');
        btn.disabled = r.acionado;
        btn.innerHTML = `<div class="r-title">${r.acionado?'&#10003; ':''}${d.title}</div><div class="r-sub">${r.acionado ? 'Acionado' : d.sub}</div>`;
        btn.addEventListener('click', ()=>{
          if(r.acionado) return;
          r.acionado = true;
          if(d.key==='k9'){ r.acionadoAt = state.real.seconds; renderK9TimerFloat(); }
          logEvent('Fase 2 — Reconhecimento', `Recurso extra acionado: ${d.title}.`);
          drawResources();
        });
        resourceRow.appendChild(btn);
      });
    }
    drawResources();

    function pushFeed(text){
      const el = document.createElement('div'); el.className='feed-item'; el.textContent = text;
      feed.insertBefore(el, feed.firstChild);
    }

    function drawHint(){
      if(selectedId){
        const m = militar(selectedId);
        hint.innerHTML = `<div class="select-hint">Militar selecionado: <strong>${m.name}</strong> — escolha a ação abaixo. <span style="cursor:pointer; text-decoration:underline;" id="cancelSel">cancelar</span></div>`;
        hint.querySelector('#cancelSel').addEventListener('click', ()=>{ selectedId=null; drawAll(); });
      } else {
        hint.innerHTML = `<div class="select-hint" style="border-style:solid; opacity:.7;">Selecione um militar disponível na lista ao lado para atribuir uma ação.</div>`;
      }
    }

    function drawActions(){
      list.innerHTML = '';
      const visible = RECON_ACTIONS.filter(a=> !a.requires || state.reconhecimento[a.requires]);
      visible.forEach(a=>{
        const done = state.reconhecimento[a.id];
        const btn = document.createElement('button');
        btn.className = 'action-btn' + (done?' done':'');
        btn.disabled = done || !selectedId;
        btn.innerHTML = `<div><div class="a-title">${done?'&#10003; ':''}${a.title}</div><div class="a-sub">${a.sub}</div></div><div class="a-tag">${done?'Concluído':(a.seconds>0?a.seconds+'s':'Imediato')}</div>`;
        btn.addEventListener('click', ()=>{
          if(!selectedId || done) return;
          const m = militar(selectedId);
          const mName = m.name;
          if(a.seconds===0){
            state.reconhecimento[a.id] = true;
            logEvent('Fase 2 — Reconhecimento', `${a.title} concluído por ${mName}.`);
            pushFeed(`✓ ${mName} concluiu: ${a.title}`);
            selectedId = null;
            drawAll();
            return;
          }
          scheduleTask({
            militarIds:[selectedId], seconds:a.seconds, label:a.title,
            onComplete:()=>{
              state.reconhecimento[a.id] = true;
              logEvent('Fase 2 — Reconhecimento', `${a.title} concluído por ${mName}.`);
              pushFeed(`✓ ${mName} concluiu: ${a.title}`);
              if(a.id==='recon') showRisk();
              drawAll();
            }
          });
          logEvent('Fase 2 — Reconhecimento', `${mName} foi designado para: ${a.title}.`);
          selectedId = null;
          drawAll();
        });
        list.appendChild(btn);
      });
    }

    function drawTeamAction(){
      if(!state.reconhecimento.recon){ teamAction.style.display='none'; return; }
      teamAction.style.display='flex';
      const done = state.reconhecimento.escoramento;
      const free = teamFree('cerd');
      teamAction.className = 'action-btn' + (done?' done':'');
      teamAction.disabled = done || !free;
      teamAction.innerHTML = `<div><div class="a-title">${done?'&#10003; ':''}Escoramento Preventivo da Estrutura</div><div class="a-sub">${free?'Exige toda a equipe CERD disponível simultaneamente.':'Aguardando toda a equipe CERD ficar disponível.'}</div></div><div class="a-tag">${done?'Concluído':'25s · Equipe CERD'}</div>`;
    }
    teamAction.addEventListener('click', ()=>{
      if(state.reconhecimento.escoramento || !state.reconhecimento.recon || !teamFree('cerd')) return;
      const ids = teamMembers('cerd').map(m=>m.id);
      scheduleTask({
        militarIds: ids, seconds:25, label:'Escoramento Preventivo (equipe)',
        onComplete:()=>{
          state.reconhecimento.escoramento = true;
          logEvent('Fase 2 — Reconhecimento', 'Escoramento preventivo concluído por toda a equipe CERD.');
          pushFeed('✓ Equipe CERD concluiu: Escoramento Preventivo');
          drawAll();
        }
      });
      logEvent('Fase 2 — Reconhecimento', 'Toda a equipe CERD foi empenhada no escoramento preventivo.');
      drawAll();
    });

    function showRisk(){
      if(riskShown) return;
      riskShown = true;
      riskBox.innerHTML = `<div class="consequence info">
        <strong>Riscos identificados no Recon 360°:</strong> possibilidade de colapso adicional das casas laterais geminadas · rede elétrica ainda não confirmada como desligada · possível vazamento de gás residual não confirmado · paredes sem escoramento preventivo.
      </div>`;
    }
    if(state.reconhecimento.recon) showRisk();

    function drawAll(){
      drawHint();
      drawActions();
      drawTeamAction();
      milOpts.selectedId = selectedId;
      if(splitOpts._milCard) splitOpts._milCard.redraw();
    }
    drawAllRef = drawAll;
    drawAll();

    state.tickHooks.push(()=>{ drawActions(); drawTeamAction(); });
  }, [ buildCroquiCard('Croqui da Cena', {showJovem:true}).card ], splitOpts);

  footerNav(panel, {
    onBack:()=>goPhase(0),
    onNext:()=>{ logEvent('Fase 2 — Reconhecimento', 'Guarnição avançou de fase.'); goPhase(2); }
  });
}

/* ---------------------------------------------------------------------- */
/* 3. PLANO DE SEGURANÇA (texto simplificado, mecânica VCFS mantida)         */
/* ---------------------------------------------------------------------- */
const VCFS_CATEGORIES = [
  {key:'vigia', label:'Vigia', keywords:['vigia da operacao','observador de riscos','sentinela da estrutura','alguem de olho na estrutura','quem vai monitorar os riscos','o vigia vai ser','vigia'], example:'"O Sd Julio vai ficar de vigia, de olho na estrutura."'},
  {key:'comunicacao', label:'Comunicação', keywords:['forma de comunicacao','sinal combinado','comunicacao por radio','comunicacao por apito','canal de comunicacao da equipe','comunicacao sera'], example:'"Comunicação será por apito, 3 toques em caso de emergência."'},
  {key:'fuga', label:'Rota de Fuga', keywords:['rota de fuga','saida de emergencia','caminho de saida rapido','por onde vamos sair','rota de saida da equipe'], example:'"Rota de fuga pelos fundos da casa."'},
  {key:'segura', label:'Rota Segura', keywords:['rota segura','ponto de encontro','local seguro pra equipe','zona segura','ponto seguro de encontro'], example:'"Rota segura até a esquina da avenida principal."'},
];

function renderSeguranca(view){
  const panel = panelShell(view, 'Fase 03 — Briefing de Segurança', 'Plano de Segurança');
  panel.innerHTML += `<p><strong>Chefe de Guarnição, defina o Plano de Segurança.</strong></p>`;

  const pillsWrap = document.createElement('div'); pillsWrap.className='statuspills';
  panel.appendChild(pillsWrap);
  function drawPills(){
    pillsWrap.innerHTML = '';
    VCFS_CATEGORIES.filter(c=>state.seguranca[c.key]).forEach(c=>{
      const el = document.createElement('div');
      el.className = 'pill on';
      el.innerHTML = `<span class="dot"></span>${c.label}`;
      pillsWrap.appendChild(el);
    });
  }
  drawPills();

  let croquiApi = null;

  splitScreen(panel, (leftEl)=>{
    const logKey='seguranca';
    if(!state.chatLogs[logKey]) state.chatLogs[logKey] = {radio:[]};
    const wrap = document.createElement('div'); wrap.className='chatpanel';
    const body = document.createElement('div'); body.className='chat-body';
    wrap.appendChild(body);
    function renderMessages(){
      body.innerHTML='';
      const msgs = state.chatLogs[logKey].radio;
      if(msgs.length===0){
        const hint = document.createElement('div'); hint.className='chat-empty';
        hint.textContent = 'Comunique o VCFS para a equipe (pode falar tudo de uma vez ou em mensagens separadas).';
        body.appendChild(hint);
      }
      msgs.forEach(m=>{
        const b = document.createElement('div');
        b.className = 'chat-msg ' + (m.from==='user'?'out':'in');
        b.innerHTML = `<div class="bubble${m.coach?' coach':''}">${m.text}</div>`;
        body.appendChild(b);
      });
      body.scrollTop = body.scrollHeight;
    }
    renderMessages();

    const inputRow = document.createElement('div'); inputRow.className='chat-inputrow';
    const input = document.createElement('input');
    input.type='text'; input.className='chat-input'; input.placeholder='Descreva o plano de segurança e pressione Enter...';
    const sendBtn = document.createElement('button'); sendBtn.className='chat-send'; sendBtn.innerHTML='&#10148;'; sendBtn.type='button';
    inputRow.appendChild(input); inputRow.appendChild(sendBtn);
    wrap.appendChild(inputRow);

    function send(){
      const text = input.value.trim();
      if(!text) return;
      input.value='';
      state.chatLogs[logKey].radio.push({from:'user', text});
      sndSend();
      renderMessages();
      const typingEl = document.createElement('div');
      typingEl.className = 'chat-msg in';
      typingEl.innerHTML = `<div class="bubble typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
      body.appendChild(typingEl);
      body.scrollTop = body.scrollHeight;
      const detected = [];
      VCFS_CATEGORIES.forEach(c=>{
        const score = intentScore(text, c);
        if(score>=0.55 && !state.seguranca[c.key]){
          state.seguranca[c.key] = true;
          detected.push(c.label);
        }
      });
      setTimeout(()=>{
        typingEl.remove();
        let reply;
        if(detected.length){
          reply = `Central: Entendido — ${detected.join(', ')} registrado(s).`;
          logEvent('Fase 3 — Plano de Segurança', `Item(ns) do VCFS comunicado(s): ${detected.join(', ')}.`);
        } else {
          const missing = VCFS_CATEGORIES.filter(c=>!state.seguranca[c.key]);
          if(missing.length){
            reply = `Central: Não identifiquei nenhum item novo do plano de segurança nessa mensagem. Ainda faltam: ${missing.map(c=>c.label).join(', ')}. Exemplo: <em>${missing[0].example}</em>`;
            reply = `<span class="coach">${reply}</span>`;
          } else {
            reply = 'Central: Plano de segurança já comunicado por completo.';
          }
        }
        state.chatLogs[logKey].radio.push({from:'system', text: reply, coach: detected.length===0});
        renderMessages();
        sndReceive();
        drawPills();
      }, 650);
    }
    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
    leftEl.appendChild(wrap);

    const note = document.createElement('p'); note.className='muted'; note.style.marginTop='10px'; note.style.fontSize='11.5px';
    note.innerHTML = 'Militares ocupados em tarefas da Fase 2 podem não ter ouvido este briefing — isso terá consequência mais adiante.';
    leftEl.appendChild(note);

    input.focus();
  }, (()=>{
    const built = buildCroquiCard('Croqui — Marcar Plano de Segurança', {
      showJovem:true, marks: state.seguranca.marks
    });
    const modeBtns = document.createElement('div'); modeBtns.className='croqui-mode-btns';
    modeBtns.innerHTML = `
      <button class="btn sm gold" id="modeFuga" type="button">Marcar Rota de Fuga</button>
      <button class="btn sm gold" id="modeSegura" type="button">Marcar Zona Segura</button>
    `;
    built.card.insertBefore(modeBtns, built.card.querySelector('.croqui-legend'));
    const hintEl = document.createElement('div'); hintEl.className='croqui-hint'; hintEl.textContent='';
    built.card.appendChild(hintEl);

    croquiApi = { mode:null, wrap: built.wrap };
    function redrawCroqui(){
      renderCroqui(built.wrap, {
        showJovem:true, marks: state.seguranca.marks,
        interactive:{ onPlace:(x,y)=>{
          if(!croquiApi.mode) return;
          state.seguranca.marks[croquiApi.mode] = {x,y};
          state.seguranca[croquiApi.mode] = true;
          logEvent('Fase 3 — Plano de Segurança', `${croquiApi.mode==='fuga'?'Rota de fuga':'Zona segura'} marcada no croqui.`);
          croquiApi.mode = null;
          hintEl.textContent = '';
          drawPills();
          redrawCroqui();
        }}
      });
    }
    modeBtns.querySelector('#modeFuga').addEventListener('click', ()=>{
      croquiApi.mode='fuga'; hintEl.textContent='Clique no croqui para marcar a rota de fuga.';
      redrawCroqui();
    });
    modeBtns.querySelector('#modeSegura').addEventListener('click', ()=>{
      croquiApi.mode='segura'; hintEl.textContent='Clique no croqui para marcar a zona segura.';
      redrawCroqui();
    });
    redrawCroqui();
    return [built.card];
  })());

  footerNav(panel, {
    onBack:()=>goPhase(1),
    nextLabel:'Comunicar e Avançar',
    onNext:()=>{
      // registra quem estava ausente (ocupado) no momento do briefing
      const ausentes = teamMembers('cerd').filter(m=>isBusy(m)).map(m=>m.name);
      state.seguranca.vigiaAusente = ausentes.length ? ausentes : null;
      if(ausentes.length){
        logEvent('Fase 3 — Plano de Segurança', `Ausente(s) do briefing por estarem em tarefa: ${ausentes.join(', ')}.`);
      }
      logEvent('Fase 3 — Plano de Segurança', 'Guarnição avançou de fase.');
      goPhase(3);
    }
  });
}

/* ---------------------------------------------------------------------- */
/* 4. GERENCIAMENTO DE VÍTIMAS (setores fixos, buscas em dupla)              */
/* ---------------------------------------------------------------------- */
const SETOR_VICTIM = { s1:null, s2:'menina', s3:'mae', s4:null };
const SETOR_NAMES = { s1:'Setor 1 — Garagem', s2:'Setor 2 — Banheiro', s3:'Setor 3 — Quarto/Fundos', s4:'Setor 4 — Sala' };

function renderGerenciamento(view){
  const panel = panelShell(view, 'Fase 04 — Operações no Local', 'Gerenciamento de Vítimas');
  panel.innerHTML += `<p>Setorize a busca e empregue as duplas disponíveis. Cada setor precisa ser vistoriado — o croqui é sua principal ferramenta de comando nesta fase.</p>`;

  const inlineAnchor = document.createElement('div');
  const k9Anchor = document.createElement('div');

  let croquiWrap = null;
  function redrawCroqui(){
    if(!croquiWrap) return;
    renderCroqui(croquiWrap, {
      sectors:true,
      showJovem:true,
      showMenina: state.vitimas.menina.found,
      showMae: state.vitimas.mae.found,
      onJovemClick: ()=> openJovemPanel(),
      onSectorClick: (id)=> openSectorPanel(id),
    });
  }

  function clearInline(){ inlineAnchor.innerHTML = ''; }

  function openJovemPanel(){
    clearInline();
    const p = document.createElement('div'); p.className='inline-panel';
    if(state.jovem.resgatado){
      p.innerHTML = `<h4>Jovem — Garagem</h4><p style="margin:0;">Extração concluída pela ${state.jovem.team==='cerd'?'Equipe CERD':'Cia Serra'}. Jovem resgatado.</p>`;
    } else if(state.jovem.delegado){
      const equipe = state.jovem.team==='cerd' ? teamMembers('cerd')[0] : teamMembers('serra')[0];
      p.innerHTML = `<h4>Jovem — Garagem</h4><p style="margin:0;">${state.jovem.team==='cerd'?'Equipe CERD':'Cia Serra'} empenhada na extração (método: ${state.jovem.metodo==='almofada'?'almofada pneumática':'corte da coluna'}). Tempo restante: <strong>${fmtSec(busyRemaining(equipe))}</strong>.</p>`;
    } else {
      p.innerHTML = `<h4>Jovem — Garagem</h4><p>Qual equipe fará a extração?</p>
        <div class="btnrow">
          <button class="btn primary sm" id="teamCerd">Equipe CERD</button>
          <button class="btn gold sm" id="teamSerra">Cia Serra</button>
        </div>
        <div id="metodoWrap" style="display:none; margin-top:12px;">
          <p style="margin:0 0 8px;">Escolha o método de extração:</p>
          <div class="btnrow">
            <button class="btn gold sm" id="metAlmofada">Almofada Pneumática</button>
            <button class="btn gold sm" id="metCorte">Corte da Coluna</button>
          </div>
        </div>
      `;
    }
    inlineAnchor.appendChild(p);
    if(!state.jovem.delegado && !state.jovem.resgatado){
      let equipeEscolhida = null;
      const metodoWrap = p.querySelector('#metodoWrap');
      p.querySelector('#teamCerd').addEventListener('click', ()=>{ equipeEscolhida='cerd'; metodoWrap.style.display='block'; });
      p.querySelector('#teamSerra').addEventListener('click', ()=>{ equipeEscolhida='serra'; metodoWrap.style.display='block'; });
      p.querySelector('#metAlmofada').addEventListener('click', ()=> delegarJovem(equipeEscolhida,'almofada'));
      p.querySelector('#metCorte').addEventListener('click', ()=> delegarJovem(equipeEscolhida,'corte'));
    }
  }
  function delegarJovem(equipe, metodo){
    if(!equipe) return;
    state.jovem.delegado = true; state.jovem.metodo = metodo; state.jovem.team = equipe;
    const seconds = metodo==='almofada' ? 150 : 300;
    const ids = teamMembers(equipe).map(m=>m.id);
    scheduleTask({
      militarIds: ids, seconds, label:'Extração do Jovem',
      onComplete:()=>{
        state.jovem.resgatado = true;
        logEvent('Fase 4 — Gerenciamento de Vítimas', `Jovem resgatado pela ${equipe==='cerd'?'Equipe CERD':'Cia Serra'}.`);
        clearInline();
      }
    });
    logEvent('Fase 4 — Gerenciamento de Vítimas', `Extração do jovem delegada à ${equipe==='cerd'?'Equipe CERD':'Cia Serra'} — método: ${metodo==='almofada'?'almofada pneumática':'corte da coluna'}.`);
    openJovemPanel();
  }

  let picked = [];
  function openSectorPanel(id){
    const sec = state.setores[id];
    const victimKey = SETOR_VICTIM[id];
    clearInline();
    picked = [];
    const p = document.createElement('div'); p.className='inline-panel';

    if(sec.visited && (!victimKey || sec.secondaryDone)){
      p.innerHTML = `<h4>${SETOR_NAMES[id]}</h4><p style="margin:0;">${victimKey && sec.secondaryDone ? 'Busca concluída — vítima confirmada e registrada.' : 'Setor já vistoriado — nenhuma vítima encontrada.'}</p>`;
      inlineAnchor.appendChild(p);
      return;
    }

    if(!sec.visited){
      const seconds = 10;
      p.innerHTML = `<h4>${SETOR_NAMES[id]} — Busca Primária</h4>
        <p>Selecione uma dupla de militares disponíveis (CERD ou Cia Serra) para a busca primária.</p>
        <div class="pick-dupla" id="pickDupla"></div>
        <div class="btnrow"><button class="btn primary sm" id="confirmBusca" disabled>Iniciar Busca Primária</button></div>
      `;
      inlineAnchor.appendChild(p);
      const pickWrap = p.querySelector('#pickDupla');
      function drawPick(){
        pickWrap.innerHTML = '';
        state.militares.forEach(m=>{
          const busy = isBusy(m);
          const chip = document.createElement('div');
          chip.className = 'pick-chip' + (picked.includes(m.id)?' on':'') + (busy?' disabled':'');
          chip.textContent = m.name + (busy?` (${fmtSec(busyRemaining(m))})`:'');
          if(!busy){
            chip.addEventListener('click', ()=>{
              if(picked.includes(m.id)) picked = picked.filter(x=>x!==m.id);
              else if(picked.length<2) picked.push(m.id);
              drawPick();
              p.querySelector('#confirmBusca').disabled = picked.length!==2;
            });
          }
          pickWrap.appendChild(chip);
        });
      }
      drawPick();
      p.querySelector('#confirmBusca').addEventListener('click', ()=>{
        if(picked.length!==2) return;
        const duplaNames = picked.map(pid=>militar(pid).name);
        scheduleTask({
          militarIds: picked, seconds, label:`Busca Primária — ${SETOR_NAMES[id]}`,
          onComplete:()=>{
            sec.visited = true;
            if(victimKey){
              logEvent('Fase 4 — Gerenciamento de Vítimas', `Busca primária no ${SETOR_NAMES[id]} (${duplaNames.join(' e ')}) indica possível vítima — requer busca secundária.`);
            } else {
              logEvent('Fase 4 — Gerenciamento de Vítimas', `Busca primária no ${SETOR_NAMES[id]} (${duplaNames.join(' e ')}) — nenhuma vítima encontrada.`);
            }
            clearInline();
            redrawCroqui();
          }
        });
        logEvent('Fase 4 — Gerenciamento de Vítimas', `Dupla designada para busca primária no ${SETOR_NAMES[id]}: ${duplaNames.join(' e ')}.`);
        clearInline();
      });
      return;
    }

    p.innerHTML = `<h4>${SETOR_NAMES[id]} — Busca Secundária</h4>
      <p>Sinais de possível vítima detectados na busca primária. Escolha a técnica de confirmação:</p>
      <div class="btnrow">
        <button class="btn gold sm" id="tecChamado">Chamado e Escuta</button>
        <button class="btn gold sm" id="tecDelsar">Busca Técnica — Delsar</button>
      </div>
      <div id="secPickWrap" style="display:none; margin-top:12px;">
        <p style="margin:0 0 8px; font-size:12.5px;" id="secPickLabel"></p>
        <div class="pick-dupla" id="pickDupla2"></div>
        <div class="btnrow"><button class="btn primary sm" id="confirmBusca2" disabled>Iniciar Busca</button></div>
      </div>
    `;
    inlineAnchor.appendChild(p);
    let tecnica = null;
    const secPickWrap = p.querySelector('#secPickWrap');
    const secLabel = p.querySelector('#secPickLabel');
    function minPara(t){ return t==='delsar' ? 2 : 4; }
    function armTecnica(t){
      tecnica = t;
      secPickWrap.style.display = 'block';
      secLabel.textContent = `${t==='chamado'?'Chamado e Escuta':'Delsar'} — mínimo ${minPara(t)} militares disponíveis.`;
      drawPick2();
    }
    p.querySelector('#tecChamado').addEventListener('click', ()=>armTecnica('chamado'));
    p.querySelector('#tecDelsar').addEventListener('click', ()=>armTecnica('delsar'));
    const pickWrap2 = p.querySelector('#pickDupla2');
    function drawPick2(){
      pickWrap2.innerHTML = '';
      state.militares.forEach(m=>{
        const busy = isBusy(m);
        const chip = document.createElement('div');
        chip.className = 'pick-chip' + (picked.includes(m.id)?' on':'') + (busy?' disabled':'');
        chip.textContent = m.name + (busy?` (${fmtSec(busyRemaining(m))})`:'');
        if(!busy){
          chip.addEventListener('click', ()=>{
            if(picked.includes(m.id)) picked = picked.filter(x=>x!==m.id);
            else picked.push(m.id);
            drawPick2();
            p.querySelector('#confirmBusca2').disabled = picked.length<minPara(tecnica);
          });
        }
        pickWrap2.appendChild(chip);
      });
    }
    p.querySelector('#confirmBusca2').addEventListener('click', ()=>{
      if(picked.length<minPara(tecnica) || !tecnica) return;
      const seconds = tecnica==='chamado' ? 20 : 40;
      const duplaNames = picked.map(pid=>militar(pid).name);
      const pickedIds = picked.slice();
      scheduleTask({
        militarIds: pickedIds, seconds, label:`Busca Secundária — ${SETOR_NAMES[id]}`,
        onComplete:()=>{
          const origem = `Busca secundária (${tecnica==='chamado'?'chamado e escuta':'Delsar'}) no ${SETOR_NAMES[id]} — ${duplaNames.join(' e ')}`;
          const sucesso = tecnica==='delsar' ? true : (victimKey==='menina');
          if(sucesso){
            sec.secondaryDone = true;
            if(victimKey==='menina') marcarMeninaEncontrada(origem);
            else if(victimKey==='mae') marcarMaeEncontrada(origem);
          } else {
            logEvent('Fase 4 — Gerenciamento de Vítimas', `${origem} não obteve resposta. Considere a técnica Delsar.`);
          }
          clearInline();
          redrawCroqui();
        }
      });
      logEvent('Fase 4 — Gerenciamento de Vítimas', `Equipe designada para busca secundária (${tecnica==='chamado'?'chamado e escuta':'Delsar'}) no ${SETOR_NAMES[id]}: ${duplaNames.join(' e ')}.`);
      clearInline();
    });
  }

  let k9Sig = null;
  function k9Signature(){ const k = state.recursos.k9; return `${k.chegou}|${k.sweeping}|${k.areaLimpa}`; }
  function drawK9(){
    k9Anchor.innerHTML = '';
    if(!state.recursos.k9.chegou) return;
    const card = document.createElement('div'); card.className='inline-panel'; card.style.borderColor='var(--ok)';
    if(state.recursos.k9.areaLimpa){
      card.innerHTML = `<h4>&#128021; Equipe K9</h4><p style="margin:0;">Varredura completa já realizada — área confirmada.</p>`;
    } else if(state.recursos.k9.sweeping){
      card.innerHTML = `<h4>&#128021; Equipe K9</h4><p style="margin:0;">Varredura em andamento...</p>
        <div class="btnrow"><button class="btn primary sm" id="k9Sweep" disabled>Varredura em andamento...</button></div>`;
    } else {
      card.innerHTML = `<h4>&#128021; Equipe K9 Disponível</h4><p>Lenke e Alex podem realizar uma varredura completa de todas as áreas de uma só vez, confirmando "área limpa".</p>
        <div class="btnrow"><button class="btn primary sm" id="k9Sweep">Realizar Varredura Completa (K9)</button></div>`;
    }
    k9Anchor.appendChild(card);
    const btn = card.querySelector('#k9Sweep');
    if(btn && !state.recursos.k9.sweeping) btn.addEventListener('click', ()=>{
      state.recursos.k9.sweeping = true;
      drawK9();
      renderK9TimerFloat();
      performK9Sweep(()=>{
        state.recursos.k9.sweeping = false;
        drawK9();
        redrawCroqui();
      });
    });
  }

  splitScreen(panel, (leftEl)=>{
    const built = buildCroquiCard('Croqui — Localização das Vítimas', {
      sectors:true, showJovem:true, showMenina:state.vitimas.menina.found, showMae:state.vitimas.mae.found,
      onJovemClick: ()=>openJovemPanel(), onSectorClick:(id)=>openSectorPanel(id)
    }, true);
    croquiWrap = built.wrap;
    leftEl.appendChild(built.card);
    leftEl.appendChild(inlineAnchor);
    leftEl.appendChild(k9Anchor);
    drawK9();
    k9Sig = k9Signature();
  }, [], { croquiFocus:false });

  state.tickHooks.push(()=>{
    const sig = k9Signature();
    if(sig !== k9Sig){ k9Sig = sig; drawK9(); }
  });

  footerNav(panel, {
    onBack:()=>goPhase(2),
    onNext:()=>{ logEvent('Fase 4 — Gerenciamento de Vítimas', 'Guarnição avançou de fase.'); goPhase(4); }
  });
}

/* ---------------------------------------------------------------------- */
/* 5. PLANO DE AÇÃO (inclui Situação Crítica fundida)                        */
/* ---------------------------------------------------------------------- */
const VICTIM_DEFS = [
  {key:'homem', name:'Homem', mode:'Acessível', color:'#2b2b2b', clinical:'Óbito confirmado no local — recuperação em coordenação com a perícia.'},
  {key:'jovem', name:'Jovem (18)', mode:'Preso', color:'#e0c23c', clinical:'Coluna de concreto sobre as pernas — extração mecânica.'},
  {key:'mae', name:'Mãe', mode:'Presa', color:'#e0c23c', clinical:'Possível síndrome de esmagamento — quadro clínico instável, compressão prolongada.'},
  {key:'menina', name:'Menina (12)', mode:'Aprisionada', color:'#5c9a5a', clinical:'Célula de sobrevivência estável — consciente, sem soterramento direto.'},
];

function renderAcao(view){
  const panel = panelShell(view, 'Fase 05 — Priorização de Resgate', 'Plano de Ação');
  const victimsWrap = document.createElement('div'); victimsWrap.className='victims2';
  const inlineAnchor = document.createElement('div');
  const resultBox = document.createElement('div');

  function clearInline(){ inlineAnchor.innerHTML=''; }

  function needsAttend(key){
    const v = state.vitimas[key];
    return v.found && !v.preDeceased && !v.resolvedBy;
  }

  function clinicalStatus(key){
    const v = state.vitimas[key];
    if(key==='mae' && v.preDeceased) return 'Óbito.';
    if(key==='menina') return v.resolvedBy==='cerd' ? 'Resgatada — estável.' : 'Estável, consciente. Sem sinais de deterioração.';
    if(v.resolvedBy==='cerd') return 'Resgatada — encaminhada ao SAMU consciente.';
    if(v.stabilizedBySamu) return 'Instável, porém mantida estável pelo SAMU no local.';
    const elapsed = v.foundAt!==null ? state.real.seconds - v.foundAt : 0;
    return elapsed>150 ? 'CRÍTICA — quadro em deterioração progressiva.' : 'Instável — compressão prolongada, monitorando.';
  }

  function statusLabel(key){
    if(key==='homem') return 'Óbito';
    if(key==='jovem'){
      if(state.jovem.resgatado) return 'Resgatado';
      if(state.jovem.delegado) return `${state.jovem.team==='cerd'?'Equipe CERD':'Cia Serra'} em extração`;
      return 'Aguardando delegação (Fase 4)';
    }
    const v = state.vitimas[key];
    if(key==='mae' && v.preDeceased) return 'Óbito';
    if(v.resolvedBy==='cerd') return 'Resgatada';
    if(v.team==='cerd') return 'Equipe CERD em extração';
    if(v.team==='serra') return 'Cia Serra empenhada — sem previsão';
    return 'Aguardando designação';
  }

  function totalFound(){ return ['mae','menina'].filter(k=> state.vitimas[k].found && !state.vitimas[k].preDeceased).length; }
  function assignedCount(){ return ['mae','menina'].filter(k=>state.vitimas[k].found && !state.vitimas[k].preDeceased && state.vitimas[k].assigned).length; }

  function pendingCerdTasks(){
    return ['mae','menina'].filter(k=>{
      const v = state.vitimas[k];
      return v.found && !v.preDeceased && v.team==='cerd' && !v.resolvedBy;
    });
  }

  function tryAssign(key, team){
    const v = state.vitimas[key];
    const isLast = (assignedCount() + 1) >= totalFound();
    if(team==='cerd'){
      if(!teamFree('cerd')){
        alertInline('Equipe CERD está ocupada em outra tarefa no momento.');
        return;
      }
      v.team = 'cerd';
      const isNew = !v.assigned; v.assigned = true;
      logEvent('Fase 5 — Plano de Ação', `Equipe CERD designada para atender: ${key==='mae'?'mãe':'menina'}.`);
      const ids = teamMembers('cerd').map(m=>m.id);
      const seconds = isLast ? 30 : 150;
      scheduleTask({
        militarIds: ids, seconds, label:`Extração — ${key==='mae'?'Mãe':'Menina'}`,
        onComplete:()=>{
          v.resolvedBy = 'cerd';
          cancelTasksByTag(`serra-${key}`);
          logEvent('Fase 5 — Plano de Ação', `Equipe CERD concluiu a extração: ${key==='mae'?'mãe':'menina'} resgatada.`);
          drawVictims();
          if(state.acao.awaitingCompletion && pendingCerdTasks().length===0){
            state.acao.awaitingCompletion = false;
            finalizeOutcome();
          }
        }
      });
      if(isNew) registerAttend(key);
    } else if(team==='serra'){
      if(!state.jovem.resgatado){ alertInline('A Cia Serra ainda está empenhada na extração do jovem.'); return; }
      if(!teamFree('serra')){ alertInline('A Cia Serra está ocupada em outra tarefa no momento.'); return; }
      v.team = 'serra';
      const isNew = !v.assigned; v.assigned = true;
      logEvent('Fase 5 — Plano de Ação', `Cia Serra designada para atender: ${key==='mae'?'mãe':'menina'}.`);
      const ids = teamMembers('serra').map(m=>m.id);
      scheduleTask({
        militarIds: ids, seconds:1200, label:`Extração — ${key==='mae'?'Mãe':'Menina'} (Serra)`, tag:`serra-${key}`,
        onComplete:()=>{
          logEvent('Fase 5 — Plano de Ação', `Cia Serra segue com dificuldades técnicas para concluir a extração de ${key==='mae'?'mãe':'menina'}.`);
        }
      });
      if(isNew) registerAttend(key);
    } else if(team==='samu'){
      v.stabilizedBySamu = true;
      const isNew = !v.assigned; v.assigned = true;
      logEvent('Fase 5 — Plano de Ação', `SAMU acionado para estabilizar clinicamente: ${key==='mae'?'mãe':'menina'} (sem extração).`);
      if(isNew) registerAttend(key);
    }
    clearInline();
    drawVictims();
    drawFooter();
  }
  function alertInline(msg){
    clearInline();
    const p = document.createElement('div'); p.className='inline-panel';
    p.innerHTML = `<p style="margin:0;">${msg}</p>`;
    inlineAnchor.appendChild(p);
  }

  function registerAttend(key){
    if(state.acao.crisisTriggered) return;
    if(assignedCount() >= totalFound() && totalFound()>0){
      state.acao.crisisTriggered = true;
      state.acao.finalVictimKey = key;
      setTimeout(()=>{ triggerCriticoFundido(); }, 5000);
    }
  }

  function openAssignPanel(key){
    clearInline();
    const p = document.createElement('div'); p.className='inline-panel';
    const serraOk = state.jovem.resgatado;
    p.innerHTML = `<h4>Designar equipe — ${key==='mae'?'Mãe':'Menina'}</h4>
      <div class="btnrow">
        <button class="btn primary sm" id="asCerd">Equipe CERD</button>
        <button class="btn gold sm" id="asSerra" ${serraOk?'':'disabled title="Cia Serra ainda ocupada com o jovem"'}>Cia Serra</button>
        <button class="btn ghost sm" id="asSamu">SAMU — apenas estabilizar</button>
      </div>`;
    inlineAnchor.appendChild(p);
    p.querySelector('#asCerd').addEventListener('click', ()=>tryAssign(key,'cerd'));
    p.querySelector('#asSerra').addEventListener('click', ()=>tryAssign(key,'serra'));
    p.querySelector('#asSamu').addEventListener('click', ()=>tryAssign(key,'samu'));
  }

  function drawVictims(){
    victimsWrap.innerHTML = '';
    VICTIM_DEFS.forEach(def=>{
      if(def.key==='mae' && !state.vitimas.mae.found) return;
      if(def.key==='menina' && !state.vitimas.menina.found) return;
      const card = document.createElement('div'); card.className='vcard2';
      const preDeceased = def.key==='mae' && state.vitimas.mae.preDeceased;
      const clinical = (def.key==='mae'||def.key==='menina') ? clinicalStatus(def.key) : def.clinical;
      card.innerHTML = `
        <div class="v-color" style="background:${preDeceased?'#2b2b2b':def.color};"></div>
        <div class="v-body">
          <div class="v-name">${def.name}</div>
          <div class="v-meta">${preDeceased?'Óbito':def.mode} · ${statusLabel(def.key)}</div>
          <div class="v-clinical">${clinical}</div>
        </div>
      `;
      const actions = document.createElement('div'); actions.className='v-actions';
      if((def.key==='mae' && !preDeceased) || def.key==='menina'){
        const v = state.vitimas[def.key];
        if(!v.resolvedBy){
          const bAssign = document.createElement('button'); bAssign.className='btn sm gold'; bAssign.textContent='Designar Equipe';
          bAssign.addEventListener('click', ()=>openAssignPanel(def.key));
          actions.appendChild(bAssign);
        }
        const bClin = document.createElement('button'); bClin.className='btn sm ghost'; bClin.textContent='Consultar Estado Clínico';
        bClin.addEventListener('click', ()=>{
          clearInline();
          const p = document.createElement('div'); p.className='inline-panel';
          p.innerHTML = `<h4>Estado Clínico — ${def.name}</h4><p style="margin:0;">${clinicalStatus(def.key)}</p>`;
          inlineAnchor.appendChild(p);
        });
        actions.appendChild(bClin);
      }
      card.appendChild(actions);
      victimsWrap.appendChild(card);
    });
  }

  const wrap = document.createElement('div'); wrap.className='splitwrap';
  const leftCol = document.createElement('div');
  const rightCol = document.createElement('div');
  const milCard = buildMilitaresCard({});
  leftCol.appendChild(milCard.card);
  state.tickHooks.push(()=>milCard.redraw());
  rightCol.appendChild(victimsWrap);
  rightCol.appendChild(inlineAnchor);
  rightCol.appendChild(resultBox);
  wrap.appendChild(leftCol);
  wrap.appendChild(rightCol);
  panel.appendChild(wrap);

  drawVictims();
  state.tickHooks.push(()=>drawVictims());

  let footer = null;
  function drawFooter(){
    if(state.acao.crisisResolved) return;
    if(footer) footer.remove();
    footer = footerNav(panel, {
      onBack: assignedCount()>0 ? null : ()=>goPhase(3),
      onNext:()=>{
        if(totalFound()===0 || state.acao.crisisResolved){ goPhase(5); return; }
        alertInline('É necessário designar equipe para todas as vítimas localizadas antes de prosseguir.');
      }
    });
  }
  drawFooter();

  function triggerCriticoFundido(){
    sndSiren();
    const overlay = document.getElementById('critOverlay');
    const modal = document.getElementById('critModal');
    let seconds = 20;
    let answered = false;
    function draw(){
      modal.innerHTML = `
        <div class="crit-flag">
          <div class="siren"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2a7 7 0 00-7 7v5l-2 3h18l-2-3V9a7 7 0 00-7-7z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 20a2 2 0 004 0" stroke="#fff" stroke-width="1.6"/></svg></div>
          <div><div class="crit-eyebrow">Alerta Estrutural</div></div>
        </div>
        <h2>Rachaduras em Progressão</h2>
        <p>O vigia observa que as <strong>rachaduras nas paredes laterais aumentaram</strong> visivelmente. A estrutura dá sinais de instabilidade durante a extração final.</p>
        <div class="crit-timer" id="critTimer">00:${seconds.toString().padStart(2,'0')}</div>
        <div class="chat-inputrow" style="padding:0; margin-top:6px;">
          <input type="text" id="critInput" class="chat-input" placeholder="O que a guarnição faz agora?" autocomplete="off">
          <button class="chat-send" id="critSend" type="button">&#10148;</button>
        </div>
        <p class="muted" style="margin-top:10px; font-size:11.5px;">Digite a ação da guarnição e envie.</p>
      `;
      const input = document.getElementById('critInput');
      const send = document.getElementById('critSend');
      input.focus();
      const submit = ()=>{ const val = input.value.trim(); if(!val) return; resolve(val,false); };
      send.addEventListener('click', submit);
      input.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
    }
    draw();
    overlay.classList.add('show');
    const timerEl = ()=>document.getElementById('critTimer');
    const interval = setInterval(()=>{
      seconds--;
      if(timerEl()) timerEl().textContent = `00:${Math.max(seconds,0).toString().padStart(2,'0')}`;
      if(seconds<=0){ clearInterval(interval); if(!answered) resolve('',true); }
    },1000);
    const CRIT_KEYWORDS = ['sinal','apito','apitos','tocar sinal','toca o sinal','emite o sinal','sinal de emergencia','3 apitos'];
    function resolve(text, timedOut){
      if(answered) return; answered = true; clearInterval(interval);
      const norm = normalize(text);
      const correct = CRIT_KEYWORDS.some(kw=>norm.includes(normalize(kw)));
      const vcfsOk = state.seguranca.vigia && state.seguranca.comunicacao && state.seguranca.fuga && state.seguranca.segura;
      const ausentes = state.seguranca.vigiaAusente;
      let title, textOut, cls;
      if(correct){
        title='Sinal Reconhecido'; cls='good';
        textOut='O sinal padronizado (3 apitos) é emitido e reconhecido por toda a equipe, que se desloca de forma organizada. Nenhum militar fica exposto.';
        logEvent('Situação Crítica', 'A guarnição tocou o sinal de emergência padronizado; evacuação organizada, sem feridos.');
      } else if(timedOut){
        title='Tempo Esgotado'; cls='grave';
        textOut='Ninguém aciona o sinal padronizado a tempo. A equipe reage de forma desorganizada à instabilidade.';
        logEvent('Situação Crítica', 'A guarnição não reagiu a tempo ao alerta estrutural.');
      } else {
        title='Reação Não Padronizada'; cls='grave';
        textOut=`A guarnição responde "${text}" — mas essa não é a ação combinada. A reação à instabilidade se torna improvisada.`;
        logEvent('Situação Crítica', `A guarnição respondeu de forma não padronizada ("${text}").`);
      }
      let extra = '';
      if(!correct){
        if(!vcfsOk || (ausentes && ausentes.length)){
          const quem = ausentes && ausentes.length ? ausentes.join(', ') : 'um militar';
          extra = `Sem um plano de segurança comunicado a todos, <strong>${quem}</strong> não identifica a rota correta e permanece na zona quente durante a instabilidade. <strong>Resultado: politraumatismo.</strong>`;
          logEvent('Situação Crítica', `CONSEQUÊNCIA GRAVE: ${quem} sofreu politraumatismo por ausência/desconhecimento do plano de segurança.`);
        } else {
          extra = 'Ainda que o VCFS tenha sido comunicado, a ausência do sinal padronizado gera uma saída apressada. Um militar sofre escoriações leves. <strong>Resultado: ferimento leve.</strong>';
          logEvent('Situação Crítica', 'Um militar sofreu escoriações leves durante evacuação não coordenada.');
        }
      }
      modal.innerHTML = `
        <div class="crit-flag">
          <div class="siren" style="background:${correct?'var(--ok)':'var(--crit)'};"><svg viewBox="0 0 24 24" fill="none"><path d="M5 12l4 4 10-10" stroke="#0b0c0d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div><div class="crit-eyebrow" style="color:${correct?'var(--ok)':'var(--crit)'};">${title}</div></div>
        </div>
        <p>${textOut}</p>${extra?`<p style="margin-top:10px;">${extra}</p>`:''}
        <div class="crit-actions"><button class="crit-btn correct-choice" id="reforcarBtn">&#128295; Reforçar o escoramento e retomar a operação</button></div>
      `;
      document.getElementById('reforcarBtn').addEventListener('click', ()=>{
        overlay.classList.remove('show');
        logEvent('Situação Crítica', 'Escoramento reforçado; operação retomada com segurança.');
        if(pendingCerdTasks().length>0){
          state.acao.awaitingCompletion = true;
          resultBox.innerHTML = `<div class="consequence info">Escoramento reforçado. Aguardando a Equipe CERD concluir a(s) extração(ões) em andamento para consolidar o desfecho.</div>`;
        } else {
          finalizeOutcome();
        }
      });
    }
  }

  function finalizeOutcome(){
    state.acao.crisisResolved = true;
    const maeStatus = !state.vitimas.mae.found ? 'nao_encontrada'
      : state.vitimas.mae.preDeceased ? 'morta'
      : (state.vitimas.mae.resolvedBy==='cerd' ? 'salva' : 'morta');
    const meninaStatus = !state.vitimas.menina.found ? 'nao_encontrada'
      : (state.vitimas.menina.resolvedBy==='cerd' ? 'salva' : 'nao_resgatada');
    if(maeStatus==='morta' && !state.vitimas.mae.preDeceased){
      logEvent('Desfecho', 'CONSEQUÊNCIA GRAVE: a mãe não resistiu — não foi priorizada pela equipe CERD.');
      if(state.vitimas.mae.team==='serra') logEvent('Desfecho', '"Sgt Adilson (Cia Serra): não conseguimos retirar a vítima a tempo."');
    } else if(maeStatus==='salva') logEvent('Desfecho', 'A mãe foi resgatada com vida pela equipe CERD.');
    if(meninaStatus==='nao_resgatada' && state.vitimas.menina.team==='serra'){
      logEvent('Desfecho', '"Sgt Adilson (Cia Serra): não conseguimos retirar a vítima a tempo."');
    } else if(meninaStatus==='salva') logEvent('Desfecho', 'A menina foi resgatada com vida pela equipe CERD.');
    drawVictims();
    resultBox.innerHTML = '';
    footer.remove();
    footer = footerNav(panel, {
      nextLabel:'Seguir para a Desmobilização',
      onNext:()=>{
        if(pendingCerdTasks().length>0){
          alertInline('Ainda há extração em andamento — aguarde a conclusão antes de encerrar.');
          return;
        }
        goPhase(5);
      }
    });
  }

  if(totalFound()===0){
    footer.remove();
    footer = footerNav(panel, {
      gateNote:'Nenhuma vítima adicional foi localizada na Fase 4.',
      onNext:()=>{ logEvent('Fase 5 — Plano de Ação', 'Nenhuma vítima viva adicional para priorizar.'); state.acao.crisisResolved=true; goPhase(5); }
    });
  }
}

/* ---------------------------------------------------------------------- */
/* 6. DESMOBILIZAÇÃO                                                          */
/* ---------------------------------------------------------------------- */
function computeOutcome(){
  // Sempre calculado ao vivo a partir do estado atual — nunca em cache,
  // para eliminar qualquer risco de "fotografia" tirada em momento errado.
  const maeStatus = !state.vitimas.mae.found ? 'nao_encontrada'
    : state.vitimas.mae.preDeceased ? 'morta'
    : (state.vitimas.mae.resolvedBy==='cerd' ? 'salva' : 'morta');
  const meninaStatus = !state.vitimas.menina.found ? 'nao_encontrada'
    : (state.vitimas.menina.resolvedBy==='cerd' ? 'salva' : 'nao_resgatada');
  const meninaOk = !state.vitimas.menina.found || meninaStatus==='salva';
  const maeOk = !state.vitimas.mae.found || maeStatus==='salva';
  const win = state.jovem.resgatado && maeOk && meninaOk && state.vitimas.mae.found && state.vitimas.menina.found;
  const maeLabel = maeStatus==='salva' ? 'Resgatada' : maeStatus==='morta' ? 'Óbito' : 'Não localizada';
  const meninaLabel = meninaStatus==='salva' ? 'Resgatada' : meninaStatus==='nao_resgatada' ? 'Não resgatada' : 'Não localizada';
  return { win, maeStatus, meninaStatus, maeLabel, meninaLabel };
}

function renderDesmobilizacao(view){
  const k9 = state.recursos.k9;
  const k9Pendente = k9.acionado && !k9.areaLimpa;
  if(k9Pendente){
    renderK9Gate(view);
    return;
  }
  renderDesmobilizacaoReal(view);
}

function renderK9Gate(view){
  const panel = panelShell(view, 'Fase 06 — Encerramento', 'Aguardando Equipe K9');
  const box = document.createElement('div');
  panel.appendChild(box);

  function draw(){
    const k9 = state.recursos.k9;
    if(k9.chegou){
      box.innerHTML = `
        <div class="consequence good">
          <strong>Equipe K9 no local.</strong> Lenke e Alex estão prontos para a varredura final de confirmação de área limpa.
        </div>
        <p>Antes de encerrar a ocorrência, a equipe pode realizar a varredura final — isso evita que uma vítima passe despercebida.</p>
        <div class="btnrow">
          <button class="btn primary sm" id="gateSweep">Realizar Varredura com K9</button>
          <button class="btn ghost sm" id="gateSkip">Encerrar Sem Varredura</button>
        </div>
      `;
      document.getElementById('gateSweep').addEventListener('click', ()=>{
        box.innerHTML = `<div class="consequence info">Varredura em andamento...</div>`;
        performK9Sweep(()=>{ renderDesmobilizacaoReal(view); });
      });
      document.getElementById('gateSkip').addEventListener('click', ()=>{
        logEvent('Fase 6 — Encerramento', 'Guarnição optou por encerrar sem aguardar a varredura K9.');
        renderDesmobilizacaoReal(view);
      });
    } else {
      const remaining = Math.max(0, K9_WAIT_SECONDS - (state.real.seconds - k9.acionadoAt));
      box.innerHTML = `
        <div class="consequence info">
          A <strong>Equipe K9</strong> foi acionada e ainda está a caminho — chega em <strong>${fmtSec(remaining)}</strong>. Aguardar permite confirmar "área limpa" antes de encerrar.
        </div>
        <p>Vocês já concluíram as fases operacionais. Deseja aguardar a chegada da equipe K9 para uma varredura final, ou encerrar a ocorrência agora mesmo sem essa confirmação?</p>
        <div class="btnrow">
          <button class="btn primary sm" id="gateWait" disabled>Aguardando Equipe K9 (${fmtSec(remaining)})</button>
          <button class="btn ghost sm" id="gateSkip2">Encerrar Sem Aguardar</button>
        </div>
      `;
      document.getElementById('gateSkip2').addEventListener('click', ()=>{
        logEvent('Fase 6 — Encerramento', 'Guarnição optou por encerrar sem aguardar a chegada da equipe K9.');
        renderDesmobilizacaoReal(view);
      });
    }
  }
  draw();
  state.tickHooks.push(()=>{
    if(document.body.contains(box)) draw();
  });
}

function renderDesmobilizacaoReal(view){
  view.innerHTML = '';
  const panel = panelShell(view, 'Fase 06 — Encerramento', 'Desmobilização');
  panel.classList.add('printable-panel');

  const outcome = computeOutcome();
  const banner = document.createElement('div');
  banner.className = 'consequence screen-only ' + (outcome.win ? 'good' : 'grave');
  banner.innerHTML = outcome.win
    ? '<strong>DESFECHO POSITIVO</strong> — as 3 vítimas com vida (jovem, mãe e menina) foram resgatadas.'
    : `<strong>DESFECHO COM PERDA</strong> — ${outcome.maeStatus==='morta' ? 'a mãe não resistiu por falta de prioridade de atendimento.' : 'nem todas as vítimas com vida foram resgatadas.'}`;
  panel.appendChild(banner);

  panel.innerHTML += `<p class="screen-only">Com as vítimas atendidas, a equipe procede à recuperação do óbito, em coordenação com a perícia. É realizado o debriefing operacional.</p>`;

  const victims = document.createElement('div'); victims.className='victims screen-only';
  victims.innerHTML = `
    <div class="vcard"><div class="vicon">&#9878;</div><div class="vname">Homem</div><div class="vstatus dead">Óbito</div></div>
    <div class="vcard"><div class="vicon">&#128119;</div><div class="vname">Jovem (18)</div><div class="vstatus ${state.jovem.resgatado?'alive':'dead'}">${state.jovem.resgatado?'Resgatado':'Não resgatado'}</div></div>
    <div class="vcard"><div class="vicon">&#128105;</div><div class="vname">Mãe</div><div class="vstatus ${outcome.maeStatus==='salva'?'alive':'dead'}">${outcome.maeLabel}</div></div>
    <div class="vcard"><div class="vicon">&#129411;</div><div class="vname">Menina (12)</div><div class="vstatus ${outcome.meninaStatus==='salva'?'alive':'critical'}">${outcome.meninaLabel}</div></div>
  `;
  panel.appendChild(victims);

  if(!state.recursos.k9.areaLimpa){
    const hidden = document.createElement('div'); hidden.className='consequence grave screen-only';
    hidden.innerHTML = '<strong>VÍTIMA NÃO IDENTIFICADA:</strong> sem a confirmação de "área limpa" (equipe K9), a guarnição se desmobilizou sem certeza absoluta de que não havia mais vítimas na estrutura. Dias depois, constatou-se que um vizinho, cuja presença no local ninguém sabia, também estava soterrado — e não resistiu.';
    panel.appendChild(hidden);
    logEvent('Desfecho', 'CONSEQUÊNCIA GRAVE: sem confirmação de área limpa pela equipe K9, um vizinho não identificado permaneceu soterrado e morreu.');
  }

  const h2 = document.createElement('h2'); h2.className='block-title screen-only'; h2.textContent='Linha do Tempo da Ocorrência';
  panel.appendChild(h2);
  const tl = document.createElement('div'); tl.className='timeline screen-only';
  state.log.forEach(item=>{
    const row = document.createElement('div'); row.className='tl-item';
    row.innerHTML = `<div class="tl-phase">${item.phase}</div><div class="tl-text">${item.text}</div>`;
    tl.appendChild(row);
  });
  panel.appendChild(tl);

  const pend = computePendencias();
  if(pend.length){
    const hp = document.createElement('h2'); hp.className='block-title screen-only'; hp.textContent='Pontos de Atenção — Não Realizado / Não Solicitado';
    panel.appendChild(hp);
    const pl = document.createElement('div'); pl.className='pend-list screen-only';
    pend.forEach(item=>{
      const el = document.createElement('div'); el.className = 'pend-item' + (item.sev==='mild'?' mild':'');
      el.textContent = item.text;
      pl.appendChild(el);
    });
    panel.appendChild(pl);
  }

  const h3 = document.createElement('h2'); h3.className='block-title screen-only'; h3.textContent='Tempo de Ocorrência';
  panel.appendChild(h3);
  const p = document.createElement('p'); p.className='screen-only';
  p.innerHTML = `<strong>Tempo real de atuação da guarnição:</strong> ${realTimeLabel()}.`;
  panel.appendChild(p);

  const printBlock = document.createElement('div'); printBlock.className='print-only';
  printBlock.innerHTML = buildPrintReport(pend, outcome);
  panel.appendChild(printBlock);

  const f = document.createElement('div');
  f.className = 'stage-footer screen-only';
  f.innerHTML = `
    <button class="btn ghost" id="restartBtn">&#8635; Reiniciar Simulado</button>
    <button class="btn primary" id="printBtn">&#128424; Imprimir Relatório (PDF)</button>
  `;
  panel.appendChild(f);
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    if(confirm('Reiniciar o simulado do zero?')) location.reload();
  });
  document.getElementById('printBtn').addEventListener('click', ()=>{
    const dataSim = state.equipe.data ? state.equipe.data.split('-').reverse().join('-') : 'sem-data';
    const originalTitle = document.title;
    document.title = `Relatorio_RESPAD07_Equipe-${state.equipe.letra || 'X'}_${dataSim}`;
    window.print();
    setTimeout(()=>{ document.title = originalTitle; }, 1000);
  });
}
