<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESPAD 07 — Simulado de Mesa Interativo | CERD/CBMES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b0c0d;
  --panel:#15171a;
  --panel-2:#1c1f23;
  --steel:#33373d;
  --steel-line:#2a2d32;
  --red:#a81f1f;
  --red-bright:#d42c2c;
  --red-deep:#6e1414;
  --gold:#e0a53c;
  --paper:#ece8df;
  --paper-dim:#a8a49a;
  --ok:#5c9a5a;
  --warn:#e0a53c;
  --crit:#d42c2c;
  --font-display:'Oswald',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  background-image:
    radial-gradient(circle at 15% 0%, rgba(168,31,31,0.10), transparent 45%),
    radial-gradient(circle at 100% 100%, rgba(224,165,60,0.06), transparent 45%);
  color:var(--paper);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--red);color:var(--paper);}

/* Scrollbar */
::-webkit-scrollbar{width:10px;}
::-webkit-scrollbar-track{background:var(--ink);}
::-webkit-scrollbar-thumb{background:var(--steel);border-radius:6px;}

/* ---------- TOP BAR ---------- */
.topbar{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 22px;
  background:linear-gradient(180deg, rgba(11,12,13,0.97), rgba(11,12,13,0.90));
  border-bottom:1px solid var(--steel-line);
  backdrop-filter:blur(6px);
}
.topbar-left{display:flex; align-items:center; gap:14px;}
.badge-img{width:38px; height:auto; filter:drop-shadow(0 0 6px rgba(168,31,31,0.4));}
.topbar-titles{display:flex; flex-direction:column; line-height:1.15;}
.topbar-eyebrow{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.14em;
  color:var(--gold); text-transform:uppercase;
}
.topbar-title{
  font-family:var(--font-display); font-size:16px; font-weight:600;
  letter-spacing:.03em; color:var(--paper);
}
.topbar-right{display:flex; align-items:center; gap:22px;}
.clock-block{text-align:right;}
.clock-label{font-family:var(--font-mono); font-size:9px; letter-spacing:.12em; color:var(--paper-dim); text-transform:uppercase;}
.clock-value{font-family:var(--font-mono); font-size:19px; font-weight:700; color:var(--gold); letter-spacing:.03em;}

/* ---------- STEPPER ---------- */
.stepper-wrap{
  position:sticky; top:59px; z-index:40;
  background:rgba(11,12,13,0.96);
  border-bottom:1px solid var(--steel-line);
  padding:0 22px;
  overflow-x:auto;
  backdrop-filter:blur(6px);
}
.stepper{
  display:flex; align-items:stretch; min-width:max-content;
  gap:0;
}
.step{
  display:flex; align-items:center; gap:8px;
  padding:12px 16px; position:relative;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.05em;
  color:var(--paper-dim); white-space:nowrap;
  border-bottom:2px solid transparent;
  transition:color .3s ease, border-color .3s ease;
}
.step .num{
  width:18px; height:18px; border-radius:50%;
  border:1px solid var(--steel); display:flex; align-items:center; justify-content:center;
  font-size:10px; font-weight:700; flex-shrink:0;
  transition:all .3s ease;
}
.step.done .num{background:var(--ok); border-color:var(--ok); color:#0b0c0d;}
.step.active .num{background:var(--red); border-color:var(--red); color:var(--paper);}
.step.active{color:var(--paper); border-bottom-color:var(--red);}
.step.done{color:var(--paper-dim);}
.step-connector{width:20px; height:1px; background:var(--steel-line); align-self:center; flex-shrink:0;}

/* ---------- MAIN STAGE ---------- */
.stage{
  max-width:1440px; margin:0 auto; padding:36px 32px 90px;
  position:relative;
}
.stage.wide-stage{ max-width:1680px; }
.panel{
  position:relative;
  background:linear-gradient(180deg, var(--panel), var(--panel-2));
  border:1px solid var(--steel-line);
  border-radius:2px;
  padding:34px 34px 30px;
}
/* Tactical corner brackets — signature element */
.panel::before, .panel::after,
.panel .bracket-br, .panel .bracket-bl{
  content:''; position:absolute; width:22px; height:22px;
  border-color:var(--gold); opacity:.55;
}
.panel::before{ top:-1px; left:-1px; border-top:2px solid var(--gold); border-left:2px solid var(--gold);}
.panel::after{ top:-1px; right:-1px; border-top:2px solid var(--gold); border-right:2px solid var(--gold);}
.panel .bracket-bl{ position:absolute; bottom:-1px; left:-1px; border-bottom:2px solid var(--gold); border-left:2px solid var(--gold);}
.panel .bracket-br{ position:absolute; bottom:-1px; right:-1px; border-bottom:2px solid var(--gold); border-right:2px solid var(--gold);}

.phase-kicker{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.16em;
  color:var(--gold); text-transform:uppercase; margin-bottom:6px;
  display:flex; align-items:center; gap:8px;
}
.phase-kicker .dot{width:6px; height:6px; border-radius:50%; background:var(--red-bright); box-shadow:0 0 8px var(--red-bright);}
h1.phase-title{
  font-family:var(--font-display); font-size:32px; font-weight:600;
  margin:0 0 18px; letter-spacing:.01em; color:var(--paper);
  text-transform:uppercase;
}
h2.block-title{
  font-family:var(--font-display); font-size:16px; font-weight:600;
  color:var(--gold); text-transform:uppercase; letter-spacing:.04em;
  margin:26px 0 10px; padding-top:16px; border-top:1px solid var(--steel-line);
}
h2.block-title:first-of-type{border-top:none; padding-top:0; margin-top:0;}
p{line-height:1.65; font-size:15px; color:#d8d4c9; margin:0 0 12px;}
strong{color:var(--paper); font-weight:600;}
.muted{color:var(--paper-dim); font-size:13px;}

/* Info readout card (CIODES-style data) */
.readout{
  background:rgba(0,0,0,0.28); border:1px solid var(--steel-line);
  border-left:3px solid var(--red); border-radius:2px;
  padding:14px 18px; margin:10px 0 4px;
  font-size:14px; line-height:1.6; color:#d8d4c9;
}
.readout .rk{ font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; color:var(--paper-dim); text-transform:uppercase; display:block; margin-bottom:2px;}

/* Buttons */
.btn{
  font-family:var(--font-body); font-weight:600; font-size:14px;
  padding:12px 22px; border-radius:2px; border:1px solid var(--steel);
  background:var(--panel-2); color:var(--paper); cursor:pointer;
  transition:all .18s ease; letter-spacing:.01em;
  display:inline-flex; align-items:center; gap:8px;
}
.btn:hover{border-color:var(--gold); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn:disabled{opacity:.35; cursor:not-allowed; transform:none;}
.btn.primary{background:var(--red); border-color:var(--red);}
.btn.primary:hover{background:var(--red-bright); border-color:var(--red-bright);}
.btn.ghost{background:transparent;}
.btn.gold{background:transparent; border-color:var(--gold); color:var(--gold);}
.btn.gold:hover{background:rgba(224,165,60,0.1);}
.btn.wide{width:100%; justify-content:center;}
.btn.sm{padding:9px 14px; font-size:12.5px;}

/* Question chips (Acionamento) */
.qgrid{display:flex; flex-direction:column; gap:8px; margin:14px 0;}
.qchip{
  text-align:left; background:var(--panel-2); border:1px solid var(--steel-line);
  border-radius:2px; padding:13px 16px; cursor:pointer; color:var(--paper);
  font-size:14px; font-weight:500; transition:all .18s ease;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.qchip:hover:not(.answered){border-color:var(--gold); background:#212429;}
.qchip.answered{
  cursor:default; border-color:var(--steel-line); background:rgba(92,154,90,0.06);
  color:var(--paper-dim);
}
.qchip .tag{font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; padding:3px 7px; border-radius:9px; border:1px solid var(--steel); color:var(--paper-dim); text-transform:uppercase; flex-shrink:0;}
.qchip.answered .tag{border-color:var(--ok); color:var(--ok);}
.qanswer{
  margin:-2px 0 8px; padding:12px 16px; font-size:13.5px; line-height:1.6;
  background:rgba(92,154,90,0.07); border-left:3px solid var(--ok); border-radius:2px;
  color:#d8d4c9; animation:slideDown .35s ease both;
}

/* Checklist (Reconhecimento / mitigations) */
.checklist{display:flex; flex-direction:column; gap:8px; margin:14px 0;}
.check-item{
  display:flex; align-items:flex-start; gap:12px;
  background:var(--panel-2); border:1px solid var(--steel-line); border-radius:2px;
  padding:13px 16px; cursor:pointer; transition:all .18s ease;
}
.check-item:hover{border-color:var(--gold);}
.check-item.on{border-color:var(--ok); background:rgba(92,154,90,0.07);}
.check-box{
  width:19px; height:19px; border:1.5px solid var(--steel); border-radius:3px;
  flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;
  transition:all .18s ease;
}
.check-item.on .check-box{background:var(--ok); border-color:var(--ok);}
.check-box svg{width:12px; height:12px; opacity:0; transition:opacity .15s ease;}
.check-item.on .check-box svg{opacity:1;}
.check-text b{display:block; font-size:14px; color:var(--paper); margin-bottom:2px;}
.check-text span{font-size:12.5px; color:var(--paper-dim);}
.req-flag{font-family:var(--font-mono); font-size:9px; color:var(--red-bright); letter-spacing:.08em; margin-left:8px;}

/* Choice cards (branching decisions) */
.choices{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:16px 0;}
@media(max-width:640px){.choices{grid-template-columns:1fr;}}
.choice-card{
  background:var(--panel-2); border:1px solid var(--steel-line); border-radius:2px;
  padding:18px; cursor:pointer; transition:all .2s ease; text-align:left;
}
.choice-card:hover{border-color:var(--gold); transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.3);}
.choice-card.picked{border-color:var(--red); background:rgba(168,31,31,0.08);}
.choice-card h3{font-family:var(--font-display); font-size:16px; margin:0 0 6px; color:var(--paper); text-transform:uppercase; letter-spacing:.02em;}
.choice-card p{font-size:13px; margin:0; color:var(--paper-dim);}

/* Field inputs (Plano de Seguranca VCFS) */
.field-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:14px 0;}
@media(max-width:640px){.field-grid{grid-template-columns:1fr;}}
.field{display:flex; flex-direction:column; gap:6px;}
.field label{font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; color:var(--gold); text-transform:uppercase;}
.field label .letter{color:var(--red-bright); font-weight:700;}
.field input{
  background:var(--panel-2); border:1px solid var(--steel-line); border-radius:2px;
  padding:11px 13px; color:var(--paper); font-family:var(--font-body); font-size:14px;
}
.field input:focus{outline:none; border-color:var(--gold);}
.field input.filled{border-color:var(--ok);}

/* Footer nav */
.stage-footer{
  display:flex; align-items:center; justify-content:space-between;
  margin-top:26px; padding-top:20px; border-top:1px solid var(--steel-line);
}
.gate-note{font-family:var(--font-mono); font-size:11px; color:var(--paper-dim); letter-spacing:.03em;}
.gate-note.ready{color:var(--ok);}

/* Consequence banner */
.consequence{
  margin:16px 0; padding:14px 18px; border-radius:2px; font-size:13.5px; line-height:1.6;
  animation:slideDown .4s ease both;
}
.consequence.grave{background:rgba(212,44,44,0.1); border-left:3px solid var(--crit); color:#f0c9c9;}
.consequence.info{background:rgba(224,165,60,0.08); border-left:3px solid var(--gold); color:#f0dfba;}
.consequence.good{background:rgba(92,154,90,0.09); border-left:3px solid var(--ok); color:#cfe8ce;}

/* Timeline for closing report */
.timeline{display:flex; flex-direction:column; gap:0; margin:16px 0;}
.tl-item{display:flex; gap:14px; padding:12px 0; border-bottom:1px solid var(--steel-line);}
.tl-item:last-child{border-bottom:none;}
.tl-phase{font-family:var(--font-mono); font-size:10px; color:var(--gold); letter-spacing:.06em; width:120px; flex-shrink:0; text-transform:uppercase; padding-top:2px;}
.tl-text{font-size:13.5px; color:#d8d4c9; line-height:1.55;}
.tl-text b{color:var(--paper);}

/* Victim status cards */
.victims{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin:16px 0;}
@media(max-width:760px){.victims{grid-template-columns:1fr 1fr;}}
.vcard{
  background:var(--panel-2); border:1px solid var(--steel-line); border-radius:2px; padding:14px;
  text-align:center;
}
.vcard .vicon{font-size:22px; margin-bottom:6px;}
.vcard .vname{font-family:var(--font-display); font-size:13px; text-transform:uppercase; color:var(--paper); letter-spacing:.02em;}
.vcard .vstatus{font-family:var(--font-mono); font-size:10px; letter-spacing:.06em; margin-top:6px; padding:3px 8px; border-radius:9px; display:inline-block;}
.vstatus.pending{background:rgba(255,255,255,0.06); color:var(--paper-dim);}
.vstatus.alive{background:rgba(92,154,90,0.15); color:var(--ok);}
.vstatus.dead{background:rgba(212,44,44,0.15); color:var(--crit);}
.vstatus.critical{background:rgba(224,165,60,0.15); color:var(--gold);}

/* ---------- CRITICAL EVENT MODAL ---------- */
.crit-overlay{
  position:fixed; inset:0; z-index:200;
  background:rgba(5,4,4,0.88);
  display:flex; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .3s ease;
}
.crit-overlay.show{opacity:1; pointer-events:auto;}
.crit-modal{
  width:min(520px, 92vw);
  background:linear-gradient(180deg,#1c1010,#120a0a);
  border:1px solid var(--crit); border-radius:3px;
  padding:32px 30px; position:relative;
  transform:scale(.92); transition:transform .35s cubic-bezier(.2,.9,.3,1.3);
  box-shadow:0 0 0 1px rgba(212,44,44,0.2), 0 20px 60px rgba(0,0,0,0.6), 0 0 40px rgba(212,44,44,0.15);
}
.crit-overlay.show .crit-modal{transform:scale(1);}
.crit-modal::before{
  content:''; position:absolute; inset:0; border-radius:3px; pointer-events:none;
  border:1px solid var(--crit); animation:critPulse 1.1s ease-in-out infinite;
}
.crit-flag{
  display:flex; align-items:center; gap:10px; margin-bottom:14px;
}
.crit-flag .siren{
  width:34px; height:34px; border-radius:50%; background:var(--crit);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  animation:sirenBlink 1s ease-in-out infinite;
}
.crit-flag .siren svg{width:18px;height:18px;}
.crit-eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; color:var(--crit); text-transform:uppercase;}
.crit-modal h2{font-family:var(--font-display); font-size:22px; margin:2px 0 0; text-transform:uppercase; color:#fff;}
.crit-modal p{color:#e8cfcf; font-size:14px; line-height:1.6;}
.crit-timer{
  font-family:var(--font-mono); font-size:34px; font-weight:700; color:var(--crit);
  text-align:center; margin:14px 0; letter-spacing:.05em;
}
.crit-actions{display:flex; flex-direction:column; gap:10px; margin-top:16px;}
.crit-btn{
  font-family:var(--font-display); font-size:14px; letter-spacing:.03em; text-transform:uppercase;
  padding:14px; border-radius:2px; border:1px solid #4a2323; background:#241414; color:#f0d0d0;
  cursor:pointer; transition:all .15s ease; text-align:left; display:flex; align-items:center; gap:12px;
}
.crit-btn:hover{border-color:var(--crit); background:#2e1616;}
.crit-btn.correct-choice{border-color:var(--gold);}
.crit-btn .kbd{font-family:var(--font-mono); font-size:11px; background:rgba(255,255,255,0.06); padding:2px 7px; border-radius:3px;}

/* Intro screen */
.intro{
  min-height:calc(100vh - 60px); display:flex; align-items:center; justify-content:center;
  padding:60px 22px; position:relative; overflow:hidden;
}
.intro::before{
  content:''; position:absolute; inset:0;
  background:
    repeating-linear-gradient(115deg, transparent 0 40px, rgba(255,255,255,0.015) 40px 41px);
  pointer-events:none;
}
.intro-inner{max-width:640px; width:100%; min-width:0; text-align:center; position:relative; z-index:1;}
.intro-badge{width:96px; margin:0 auto 22px; filter:drop-shadow(0 0 24px rgba(168,31,31,0.35));}
.intro-eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.22em; color:var(--gold); text-transform:uppercase; margin-bottom:14px;}
.intro h1{font-family:var(--font-display); font-size:44px; line-height:1.08; margin:0 0 16px; text-transform:uppercase; letter-spacing:.01em;}
.intro h1 span{color:var(--red-bright);}
.intro p.lead{font-size:16px; color:var(--paper-dim); line-height:1.65; max-width:520px; margin:0 auto 30px;}
.intro-meta{
  display:flex; justify-content:center; gap:28px; margin:0 0 34px; flex-wrap:wrap;
}
.intro-meta div{text-align:left;}
.intro-meta .lbl{font-family:var(--font-mono); font-size:9px; color:var(--paper-dim); letter-spacing:.1em; text-transform:uppercase;}
.intro-meta .val{font-family:var(--font-display); font-size:15px; color:var(--paper); text-transform:uppercase;}

/* Phase transitions */
.phase-view{animation:phaseIn .5s cubic-bezier(.2,.7,.2,1) both;}
@keyframes phaseIn{
  from{opacity:0; transform:translateY(22px);}
  to{opacity:1; transform:translateY(0);}
}
.phase-out{animation:phaseOut .28s ease both;}
@keyframes phaseOut{
  from{opacity:1; transform:translateY(0);}
  to{opacity:0; transform:translateY(-14px);}
}
@keyframes slideDown{
  from{opacity:0; transform:translateY(-6px);}
  to{opacity:1; transform:translateY(0);}
}
@keyframes critPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(212,44,44,0.5);}
  50%{box-shadow:0 0 0 6px rgba(212,44,44,0);}
}
@keyframes sirenBlink{
  0%,100%{opacity:1; box-shadow:0 0 0 0 rgba(212,44,44,0.6);}
  50%{opacity:.7; box-shadow:0 0 0 8px rgba(212,44,44,0);}
}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001s !important; transition-duration:.001s !important;}
}

.hidden{display:none !important;}

footer.credit{
  text-align:center; padding:26px 22px 40px; color:var(--paper-dim);
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em;
}

/* ---------------------------------------------------------------------- */
/* CHAT / RÁDIO INTERFACE                                                    */
/* ---------------------------------------------------------------------- */
.chatpanel{
  border:1px solid var(--steel-line); border-radius:3px; overflow:hidden;
  background:#0f1113; margin:14px 0 6px; display:flex; flex-direction:column;
}
.chat-tabs{ display:flex; background:#0a0b0c; border-bottom:1px solid var(--steel-line); }
.chat-tab{
  flex:1; padding:11px 14px; background:transparent; border:none; cursor:pointer;
  color:var(--paper-dim); font-family:var(--font-body); font-weight:600; font-size:13px;
  border-bottom:2px solid transparent; transition:all .18s ease;
}
.chat-tab.active{ color:var(--paper); border-bottom-color:var(--gold); background:rgba(224,165,60,0.06); }
.chat-body{
  min-height:220px; max-height:360px; overflow-y:auto; padding:16px;
  display:flex; flex-direction:column; gap:9px;
  background:
    radial-gradient(circle at 20% 10%, rgba(168,31,31,0.03), transparent 40%),
    #101215;
}
.chat-empty{ margin:auto; color:var(--paper-dim); font-size:12.5px; font-family:var(--font-mono); text-align:center; padding:20px; }
.chat-msg{ display:flex; max-width:82%; }
.chat-msg.in{ align-self:flex-start; }
.chat-msg.out{ align-self:flex-end; }
.chat-msg .bubble{
  padding:10px 13px; border-radius:10px; font-size:13.5px; line-height:1.55;
  animation:bubbleIn .25s ease both;
}
.chat-msg.in .bubble{ background:#20242a; color:#dcd8cd; border-bottom-left-radius:3px; }
.chat-msg.out .bubble{ background:var(--red-deep); color:#f3e8e8; border-bottom-right-radius:3px; }
@keyframes bubbleIn{ from{opacity:0; transform:translateY(6px) scale(.97);} to{opacity:1; transform:translateY(0) scale(1);} }
.chat-inputrow{
  display:flex; gap:8px; padding:11px; background:#0a0b0c; border-top:1px solid var(--steel-line);
}
.chat-input{
  flex:1; background:#1a1d21; border:1px solid var(--steel-line); border-radius:20px;
  padding:10px 16px; color:var(--paper); font-family:var(--font-body); font-size:13.5px;
}
.chat-input:focus{ outline:none; border-color:var(--gold); }
.chat-input:disabled{ opacity:.4; }
.chat-send{
  width:38px; height:38px; border-radius:50%; border:none; background:var(--red);
  color:#fff; font-size:15px; cursor:pointer; flex-shrink:0; transition:all .15s ease;
  display:flex; align-items:center; justify-content:center;
}
.chat-send:hover{ background:var(--red-bright); }
.chat-send:disabled{ opacity:.35; cursor:not-allowed; }

/* status pills */
.statuspills{ display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 4px; }
.pill{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em;
  padding:6px 12px; border-radius:20px; border:1px solid var(--steel-line);
  color:var(--paper-dim); background:var(--panel-2); display:flex; align-items:center; gap:6px;
  transition:all .25s ease;
}
.pill .dot{ width:6px; height:6px; border-radius:50%; background:var(--steel); flex-shrink:0; }
.pill.on{ border-color:var(--ok); color:var(--ok); background:rgba(92,154,90,0.08); }
.pill.on .dot{ background:var(--ok); box-shadow:0 0 6px var(--ok); }

/* ---------------------------------------------------------------------- */
/* FLOATING REAL-TIME STOPWATCH                                             */
/* ---------------------------------------------------------------------- */
.real-timer-float{
  position:fixed; bottom:22px; right:22px; z-index:150;
  background:linear-gradient(180deg,#1a1c1f,#101214);
  border:1px solid var(--gold); border-radius:10px;
  padding:12px 18px; display:flex; align-items:center; gap:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(224,165,60,0.15);
  opacity:0; transform:translateY(16px); pointer-events:none;
  transition:opacity .4s ease, transform .4s ease;
}
.real-timer-float.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
.real-timer-float .rt-icon{
  width:10px; height:10px; border-radius:50%; background:var(--red-bright);
  animation:sirenBlink 1.4s ease-in-out infinite; flex-shrink:0;
}
.real-timer-float .rt-text{ display:flex; flex-direction:column; line-height:1.2; }
.real-timer-float .rt-label{ font-family:var(--font-mono); font-size:8.5px; letter-spacing:.1em; color:var(--paper-dim); text-transform:uppercase; }
.real-timer-float .rt-value{ font-family:var(--font-mono); font-size:20px; font-weight:700; color:var(--paper); }
@media(max-width:640px){
  .real-timer-float{ bottom:12px; right:12px; padding:9px 14px; }
  .real-timer-float .rt-value{ font-size:16px; }
}
.k9-timer-float{ bottom:94px; border-color:var(--ok); box-shadow:0 10px 30px rgba(0,0,0,0.5), 0 0 0 1px rgba(92,154,90,0.2); }
.k9-timer-float.k9-done{ cursor:default !important; border-color:var(--ok); background:linear-gradient(180deg,#132015,#0e1810); }
.k9-timer-float.k9-done .rt-value{ color:var(--ok) !important; }
@media(max-width:640px){
  .k9-timer-float{ bottom:76px; }
}

/* ---------------------------------------------------------------------- */
/* PRINT / PDF REPORT                                                        */
/* ---------------------------------------------------------------------- */
.print-only{ display:none; }
.print-header{ display:none; }
@media print{
  @page{ margin:16mm 14mm; }
  body{ background:#fff !important; color:#161514 !important; font-size:12.5px; }
  .topbar, .stepper-wrap, .real-timer-float, .stage-footer, .crit-overlay, footer.credit, .croqui-lightbox{ display:none !important; }
  .screen-only{ display:none !important; }
  .print-only{ display:block !important; }
  .stage{ max-width:100%; padding:0; }
  .panel{ border:none; background:#fff; padding:0; }
  .panel::before, .panel::after, .bracket-bl, .bracket-br{ display:none !important; }
  h1.phase-title, h2.block-title{ color:#161514 !important; }
  h2.block-title{ border-top-color:#ddd; }
  p, .tl-text, .chat-msg .bubble{ color:#161514 !important; }

  .print-header{
    display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:6px; padding:0 0 16px;
    border-bottom:3px solid #a81f1f;
  }
  .print-header-left{ display:flex; align-items:center; gap:14px; }
  .print-header img{ width:56px; }
  .print-header .pt-eyebrow{ font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; color:#a81f1f; text-transform:uppercase; }
  .print-header .pt-title{ font-family:var(--font-display); font-size:21px; font-weight:700; color:#161514; margin-top:2px; }
  .print-header .pt-badge{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
    padding:7px 14px; border-radius:3px; font-weight:700;
  }
  .print-header .pt-badge.win{ background:#e3f0e2; color:#2f6b2c; border:1px solid #96c992; }
  .print-header .pt-badge.lose{ background:#f7e3e3; color:#a32020; border:1px solid #e2a1a1; }

  .print-meta{ display:flex; gap:0; margin:14px 0 6px; border:1px solid #e5e2da; border-radius:4px; overflow:hidden; }
  .print-meta div{ flex:1; padding:9px 14px; border-right:1px solid #e5e2da; }
  .print-meta div:last-child{ border-right:none; }
  .print-meta span{ font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; color:#8a8478; text-transform:uppercase; display:block; }
  .print-meta b{ display:block; color:#161514; font-size:13.5px; font-family:var(--font-display); margin-top:2px; }

  .print-section-title{
    font-family:var(--font-display); font-size:13.5px; text-transform:uppercase; letter-spacing:.06em;
    color:#fff; background:#a81f1f; padding:6px 12px; margin:22px 0 10px; border-radius:2px;
  }
  .print-tl-item{ padding:7px 2px; border-bottom:1px solid #ece9e2; font-size:11.5px; page-break-inside:avoid; }
  .print-tl-item b{ color:#a81f1f; font-family:var(--font-mono); font-size:9px; letter-spacing:.04em; text-transform:uppercase; }
  .print-chat-block{ margin-bottom:12px; page-break-inside:avoid; }
  .print-chat-block h4{ font-family:var(--font-display); font-size:12px; margin:0 0 5px; color:#161514; border-bottom:1px solid #e5e2da; padding-bottom:3px; }
  .print-chat-line{ font-size:11px; margin:2px 0; color:#333; }
  .print-chat-line b{ color:#a81f1f; }
  .print-victims{ display:flex; gap:8px; margin:10px 0 20px; flex-wrap:wrap; }
  .print-vcard{ border:1px solid #e5e2da; border-left:3px solid #a81f1f; border-radius:3px; padding:8px 12px; font-size:11px; min-width:120px; }
  .print-vcard b{ display:block; font-family:var(--font-display); font-size:12.5px; margin-bottom:1px; }
  .printable-panel > .phase-kicker, .printable-panel > h1.phase-title{ display:none !important; }
  .print-footer{ margin-top:24px; padding-top:10px; border-top:1px solid #e5e2da; font-family:var(--font-mono); font-size:9px; color:#8a8478; text-align:center; letter-spacing:.05em; }
  .print-signature{ display:flex; gap:24px; margin:14px 0 6px; flex-wrap:wrap; page-break-inside:avoid; }
  .sig-line{ flex:1; min-width:180px; }
  .sig-line.sig-small{ flex:0 0 140px; }
  .sig-line span{ display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:.06em; color:#8a8478; text-transform:uppercase; margin-bottom:22px; }
  .sig-blank{ border-bottom:1px solid #999; height:1px; }
}

/* ---------------------------------------------------------------------- */
/* REGISTRATION FORM (pre-START)                                            */
/* ---------------------------------------------------------------------- */
.reg-card{
  background:var(--panel-2); border:1px solid var(--steel-line); border-radius:3px;
  padding:24px 26px; margin:26px auto 0; max-width:520px; text-align:left;
}
.reg-title{
  font-family:var(--font-mono); font-size:11px; letter-spacing:.12em; color:var(--gold);
  text-transform:uppercase; margin-bottom:14px; text-align:center;
}
.reg-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
@media(max-width:520px){ .reg-row{ grid-template-columns:1fr; } .team-select{ flex-wrap:wrap; } .team-opt{ min-width:70px; } }
.reg-field{ display:flex; flex-direction:column; gap:5px; }
.reg-field.full{ grid-column:1 / -1; }
.reg-field label{ font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; color:var(--paper-dim); text-transform:uppercase; }
.reg-field label .req{ color:var(--red-bright); }
.reg-field input, .reg-field select{
  background:#1a1d21; border:1px solid var(--steel-line); border-radius:2px;
  padding:9px 11px; color:var(--paper); font-family:var(--font-body); font-size:13.5px;
}
.reg-field input:focus, .reg-field select:focus{ outline:none; border-color:var(--gold); }
.reg-field input.filled, .reg-field select.filled{ border-color:var(--ok); }
.team-select{ display:flex; gap:8px; }
.team-opt{
  flex:1; padding:10px; text-align:center; border:1px solid var(--steel-line); border-radius:2px;
  background:#1a1d21; color:var(--paper-dim); font-family:var(--font-display); font-weight:600;
  cursor:pointer; transition:all .15s ease;
}
.team-opt.sel{ border-color:var(--red); background:rgba(168,31,31,0.15); color:var(--paper); }
.reg-hint{ font-size:11.5px; color:var(--paper-dim); margin-top:2px; }

/* ---------------------------------------------------------------------- */
/* SPLIT SCREEN LAYOUT                                                      */
/* ---------------------------------------------------------------------- */
.splitwrap{ display:grid; grid-template-columns:1.4fr 1fr; gap:22px; margin:14px 0; align-items:start; }
.splitwrap.croqui-focus{ grid-template-columns:1fr 340px; }
@media(max-width:980px){ .splitwrap, .splitwrap.croqui-focus{ grid-template-columns:1fr; } }
.side-card{
  background:var(--panel-2); border:1px solid var(--steel-line); border-radius:3px; padding:16px 18px;
}
.side-card h3{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em; color:var(--gold);
  text-transform:uppercase; margin:0 0 12px; display:flex; align-items:center; gap:8px;
}
.mil-list{ display:flex; flex-direction:column; gap:8px; }
.mil-group-label{ font-family:var(--font-mono); font-size:9px; letter-spacing:.1em; color:var(--paper-dim); text-transform:uppercase; margin:10px 0 6px; }
.mil-group-label:first-child{ margin-top:0; }
.mil-item{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:2px;
  background:#191c20; border:1px solid var(--steel-line); transition:all .15s ease;
}
.mil-item.selectable{ cursor:pointer; }
.mil-item.selectable:hover{ border-color:var(--gold); }
.mil-item.picked{ border-color:var(--gold); background:rgba(224,165,60,0.1); }
.mil-item.busy{ opacity:.55; }
.mil-item .mil-avatar{
  width:30px; height:30px; border-radius:50%; background:var(--steel);
  display:flex; align-items:center; justify-content:center; font-family:var(--font-display);
  font-size:12px; color:var(--paper); flex-shrink:0;
}
.mil-item.chefe .mil-avatar{ background:var(--red); }
.mil-item.serra .mil-avatar{ background:var(--gold); color:#0b0c0d; }
.mil-item .mil-info{ line-height:1.3; flex:1; }
.mil-item .mil-name{ font-size:13px; color:var(--paper); font-weight:600; }
.mil-item .mil-role{ font-size:10.5px; color:var(--paper-dim); font-family:var(--font-mono); }
.mil-item .mil-timer{ font-family:var(--font-mono); font-size:12px; color:var(--crit); font-weight:700; flex-shrink:0; }

/* Action assign panel (Reconhecimento) */
.action-list{ display:flex; flex-direction:column; gap:8px; margin:14px 0; }
.action-btn{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  background:var(--panel-2); border:1px solid var(--steel-line); border-radius:2px;
  padding:13px 16px; cursor:pointer; transition:all .15s ease; text-align:left;
}
.action-btn:hover:not(:disabled){ border-color:var(--gold); }
.action-btn:disabled{ opacity:.4; cursor:not-allowed; }
.action-btn.done{ border-color:var(--ok); background:rgba(92,154,90,0.07); cursor:default; }
.action-btn .a-title{ font-size:14px; color:var(--paper); font-weight:600; }
.action-btn .a-sub{ font-size:11.5px; color:var(--paper-dim); margin-top:2px; }
.action-btn .a-tag{ font-family:var(--font-mono); font-size:10px; color:var(--gold); flex-shrink:0; }
.select-hint{
  font-family:var(--font-mono); font-size:11px; color:var(--gold); letter-spacing:.03em;
  padding:10px 14px; border:1px dashed var(--gold); border-radius:2px; margin-bottom:12px;
}
.feed{ display:flex; flex-direction:column; gap:6px; margin-top:16px; }
.feed-item{
  font-size:12.5px; color:#cfe8ce; background:rgba(92,154,90,0.07); border-left:2px solid var(--ok);
  padding:8px 12px; border-radius:2px; animation:slideDown .3s ease both;
}

/* ---------------------------------------------------------------------- */
/* CROQUI (diagrama isométrico, expansível)                                 */
/* ---------------------------------------------------------------------- */
.croqui-card{ margin-top:14px; }
.croqui-card.big .croqui-svg-wrap{ min-height:420px; }
.croqui-card-head{ display:flex; align-items:center; justify-content:space-between; }
.croqui-expand-btn{
  background:transparent; border:1px solid var(--steel-line); color:var(--paper-dim);
  border-radius:2px; padding:5px 10px; font-family:var(--font-mono); font-size:10px;
  cursor:pointer; transition:all .15s ease;
}
.croqui-expand-btn:hover{ border-color:var(--gold); color:var(--gold); }
.croqui-svg-wrap{ position:relative; border-radius:2px; overflow:hidden; border:1px solid var(--steel-line); background:#0a0c10; }
.croqui-svg-wrap svg{ display:block; width:100%; height:auto; }
.croqui-legend{ display:flex; flex-wrap:wrap; gap:10px 16px; margin-top:10px; font-family:var(--font-mono); font-size:10px; color:var(--paper-dim); }
.croqui-legend span{ display:inline-flex; align-items:center; gap:6px; }
.croqui-legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
.croqui-marker{ cursor:pointer; }
.croqui-marker text{ pointer-events:none; }
.croqui-sector{ cursor:pointer; transition:opacity .15s ease; }
.croqui-sector:hover .sector-fill{ opacity:0.28 !important; }
.croqui-sector text{ pointer-events:none; }
.croqui-mode-btns{ display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }
.croqui-hint{ font-size:11.5px; color:var(--gold); margin-top:8px; }

.croqui-lightbox{
  position:fixed; inset:0; z-index:300; background:rgba(5,4,4,0.92);
  display:flex; align-items:center; justify-content:center; padding:40px;
  opacity:0; pointer-events:none; transition:opacity .25s ease;
}
.croqui-lightbox.show{ opacity:1; pointer-events:auto; }
.croqui-lightbox-inner{ width:min(1200px, 100%); background:#0a0c10; border:1px solid var(--gold); border-radius:4px; padding:20px; position:relative; }
.croqui-lightbox-close{
  position:absolute; top:-14px; right:-14px; width:32px; height:32px; border-radius:50%;
  background:var(--red); border:2px solid #0b0c0d; color:#fff; font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}

/* Inline action popovers (Gerenciamento / Plano de Ação) */
.inline-panel{
  background:var(--panel-2); border:1px solid var(--gold); border-radius:2px;
  padding:16px 18px; margin:14px 0; animation:slideDown .25s ease both;
}
.inline-panel h4{ font-family:var(--font-display); font-size:14px; margin:0 0 10px; color:var(--paper); text-transform:uppercase; }
.inline-panel .btnrow{ display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
.pick-dupla{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; }
.pick-chip{
  padding:8px 14px; border-radius:20px; border:1px solid var(--steel-line); background:#191c20;
  color:var(--paper-dim); font-size:12.5px; cursor:pointer; transition:all .15s ease;
}
.pick-chip.on{ border-color:var(--gold); background:rgba(224,165,60,0.12); color:var(--paper); }
.pick-chip.disabled{ opacity:.35; cursor:not-allowed; }

/* Sectors summary badges */
.sector-tag{
  display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px;
  color:var(--paper-dim); padding:4px 9px; border:1px solid var(--steel-line); border-radius:12px; margin:2px 4px 2px 0;
}

/* Victim cards Fase 5 */
.victims2{ display:flex; flex-direction:column; gap:12px; margin:16px 0; }
.vcard2{
  display:flex; align-items:center; gap:16px; background:var(--panel-2); border:1px solid var(--steel-line);
  border-radius:3px; padding:16px 18px;
}
.vcard2 .v-color{ width:14px; height:52px; border-radius:3px; flex-shrink:0; }
.vcard2 .v-body{ flex:1; }
.vcard2 .v-name{ font-family:var(--font-display); font-size:16px; color:var(--paper); text-transform:uppercase; }
.vcard2 .v-meta{ font-family:var(--font-mono); font-size:10.5px; color:var(--paper-dim); margin-top:2px; }
.vcard2 .v-clinical{ font-size:12.5px; color:#d8d4c9; margin-top:6px; }
.vcard2 .v-actions{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex-shrink:0; }

/* ---------------------------------------------------------------------- */
/* SCENE IMAGES (Reconhecimento)                                            */
/* ---------------------------------------------------------------------- */
.scene-gallery{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:16px 0; }
@media(max-width:760px){ .scene-gallery{ grid-template-columns:1fr; } }
.scene-gallery.full{ grid-template-columns:1fr; }
.scene-img-card{ border:1px solid var(--steel-line); border-radius:2px; overflow:hidden; background:#0c0e10; }
.scene-img-card svg{ display:block; width:100%; height:auto; }
.scene-img-cap{ padding:9px 12px; font-family:var(--font-mono); font-size:10.5px; color:var(--paper-dim); letter-spacing:.03em; border-top:1px solid var(--steel-line); }

/* ---------------------------------------------------------------------- */
/* COACHING / "QUASE CERTO" MESSAGES                                        */
/* ---------------------------------------------------------------------- */
.chat-msg.in .bubble.coach{ background:#241d0f; border:1px solid rgba(224,165,60,0.35); color:#f0dfba; }

.typing-bubble{ display:flex; align-items:center; gap:4px; padding:12px 14px !important; }
.typing-dot{ width:6px; height:6px; border-radius:50%; background:#8a8478; display:inline-block; animation:typingBounce 1.2s infinite ease-in-out; }
.typing-dot:nth-child(2){ animation-delay:0.15s; }
.typing-dot:nth-child(3){ animation-delay:0.3s; }
@keyframes typingBounce{
  0%, 60%, 100%{ transform:translateY(0); opacity:0.5; }
  30%{ transform:translateY(-4px); opacity:1; }
}

/* Pendencias (Desmobilizacao) */
.pend-list{ display:flex; flex-direction:column; gap:8px; margin:12px 0; }
.pend-item{
  background:rgba(212,44,44,0.06); border-left:3px solid var(--crit); border-radius:2px;
  padding:10px 14px; font-size:13px; color:#f0c9c9;
}
.pend-item.mild{ background:rgba(224,165,60,0.06); border-left-color:var(--gold); color:#f0dfba; }

/* Recursos extras (Fase 2) */
.resource-row{ display:flex; gap:10px; flex-wrap:wrap; margin:12px 0; }
.resource-btn{
  flex:1; min-width:180px; background:var(--panel-2); border:1px solid var(--steel-line); border-radius:2px;
  padding:13px 16px; cursor:pointer; text-align:left; transition:all .15s ease;
}
.resource-btn:hover:not(:disabled){ border-color:var(--gold); }
.resource-btn.on{ border-color:var(--ok); background:rgba(92,154,90,0.08); cursor:default; }
.resource-btn .r-title{ font-size:13.5px; font-weight:600; color:var(--paper); }
.resource-btn .r-sub{ font-size:11px; color:var(--paper-dim); margin-top:2px; }
</style>

<body>

<script>
/* ==========================================================================
   RESPAD 07 — SIMULADO DE MESA INTERATIVO — BREC
   Ocorrência: explosão por vazamento de gás, casa duplex geminada,
   Rua A, Jacaraípe, Serra/ES.
   ========================================================================== */

const PHASES = [
  {id:'acionamento',     n:1},
  {id:'reconhecimento',  n:2},
  {id:'seguranca',       n:3},
  {id:'gerenciamento',   n:4},
  {id:'acao',            n:5},
  {id:'desmobilizacao',  n:6},
];

const state = {
  started:false,
  phaseIndex:0,
  clock:0,
  log:[],
  chatLogs:{},

  equipe:{ letra:null, data:'', chefe:'', condutor:'', operadores:['','','',''] },
  militares:[], // built at start

  acionamento:{ matched:{} },
  reconhecimento:{ oficial:false, recon:false, energia:false, atm:false, isolamento:false, escoramento:false, _consequenced:false },
  seguranca:{ vigia:false, comunicacao:false, fuga:false, segura:false, marks:{fuga:null, segura:null}, vigiaAusente:null },

  setores:{ // fixed USAR-style sectors
    s1:{ label:'Setor 1 — Frente/Garagem', visited:false, secondaryDone:false },
    s2:{ label:'Setor 2 — Banheiro', visited:false, secondaryDone:false },
    s3:{ label:'Setor 3 — Quarto/Fundos', visited:false, secondaryDone:false },
    s4:{ label:'Setor 4 — Sala', visited:false, secondaryDone:false },
  },
  jovem:{ delegado:false, metodo:null, resgatado:false, team:null },
  vitimas:{
    mae:{ found:false, team:null, resolvedBy:null, stabilizedBySamu:false, foundAt:null, preDeceased:false, assigned:false },
    menina:{ found:false, team:null, resolvedBy:null, stabilizedBySamu:false, foundAt:null, assigned:false },
  },
  recursos:{
    k9:{ acionado:false, acionadoAt:null, chegou:false, areaLimpa:false, popupShown:false, sweeping:false },
    reforco:{ acionado:false },
    logistica:{ acionado:false },
  },
  acao:{ crisisTriggered:false, crisisResolved:false, attendCount:0, finalVictimKey:null, awaitingCompletion:false },
  critico:{ resolved:false, respostaCorreta:null, timedOut:false },
  desfecho:{ maeStatus:null, meninaStatus:null },

  tasks:[], // scheduled real-time tasks
  tickHooks:[],

  real:{ seconds:0, running:false, intervalId:null }
};

/* ---------------------------------------------------------------------- */
/* MILITARES / TASK SCHEDULER                                                */
/* ---------------------------------------------------------------------- */
function buildMilitares(){
  const list = [];
  if(state.equipe.chefe) list.push({id:'chefe', name:state.equipe.chefe, role:'Chefe de Guarnição', team:'cerd', chefe:true, busyUntil:0, busyLabel:null, presentVCFS:true});
  if(state.equipe.condutor) list.push({id:'condutor', name:state.equipe.condutor, role:'Condutor', team:'cerd', busyUntil:0, busyLabel:null, presentVCFS:true});
  state.equipe.operadores.forEach((op,i)=>{ if(op && op.trim()) list.push({id:'op'+(i+1), name:op, role:`Operador ${i+1}`, team:'cerd', busyUntil:0, busyLabel:null, presentVCFS:true}); });
  list.push({id:'sgtAdilson', name:'Sgt Adilson', role:'Cmt. Cia Serra', team:'serra', busyUntil:0, busyLabel:null});
  list.push({id:'cbSebastiao', name:'Cb Sebastião', role:'Cia Serra', team:'serra', busyUntil:0, busyLabel:null});
  list.push({id:'cbTadeu', name:'Cb Tadeu', role:'Cia Serra', team:'serra', busyUntil:0, busyLabel:null});
  list.push({id:'sdJulio', name:'Sd Julio', role:'Cia Serra', team:'serra', busyUntil:0, busyLabel:null});
  state.militares = list;
}
function militar(id){ return state.militares.find(m=>m.id===id); }
function teamMembers(team){ return state.militares.filter(m=>m.team===team); }
function isBusy(m){ return m.busyUntil > state.real.seconds; }
function busyRemaining(m){ return Math.max(0, m.busyUntil - state.real.seconds); }
function teamFree(team){ return teamMembers(team).length>0 && teamMembers(team).every(m=>!isBusy(m)); }
function fmtSec(s){ const m=Math.floor(s/60), sec=Math.round(s%60); return `${m}:${sec.toString().padStart(2,'0')}`; }

/* ---------------------------------------------------------------------- */
/* ÁUDIO (Web Audio API — sem arquivos externos)                            */
/* ---------------------------------------------------------------------- */
let _audioCtx = null;
function getAudioCtx(){
  if(!_audioCtx){
    try{ _audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; }
  }
  if(_audioCtx.state==='suspended'){ _audioCtx.resume().catch(()=>{}); }
  return _audioCtx;
}
function beep(freq, duration, type, vol){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type||'sine';
    osc.frequency.value = freq;
    gain.gain.value = vol!==undefined?vol:0.12;
    osc.connect(gain); gain.connect(ctx.destination);
    const now = ctx.currentTime;
    osc.start(now);
    gain.gain.exponentialRampToValueAtTime(0.0005, now+duration);
    osc.stop(now+duration+0.02);
  }catch(e){}
}
function sndSend(){ beep(1450, 0.07, 'square', 0.05); }
function sndReceive(){ beep(880, 0.09, 'square', 0.07); }
function sndSiren(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  try{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type='sawtooth';
    osc.connect(gain); gain.connect(ctx.destination);
    const now = ctx.currentTime;
    gain.gain.setValueAtTime(0.05, now);
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.linearRampToValueAtTime(1000, now+0.5);
    osc.frequency.linearRampToValueAtTime(600, now+1.0);
    osc.frequency.linearRampToValueAtTime(1000, now+1.5);
    gain.gain.exponentialRampToValueAtTime(0.0005, now+1.85);
    osc.start(now); osc.stop(now+1.9);
  }catch(e){}
}
function sndK9(){ beep(660,0.15,'sine',0.09); setTimeout(()=>beep(880,0.22,'sine',0.09), 160); }

function scheduleTask({militarIds, seconds, label, onComplete, tag}){
  const endAt = state.real.seconds + seconds;
  (militarIds||[]).forEach(id=>{
    const m = militar(id);
    if(m){ m.busyUntil = endAt; m.busyLabel = label; }
  });
  const task = {endAt, onComplete, label, tag, militarIds:(militarIds||[]).slice()};
  state.tasks.push(task);
  return task;
}
function cancelTasksByTag(tag){
  const now = state.real.seconds;
  state.tasks = state.tasks.filter(t=>{
    if(t.tag===tag){
      (t.militarIds||[]).forEach(id=>{ const m = militar(id); if(m){ m.busyUntil = now; m.busyLabel = null; } });
      return false;
    }
    return true;
  });
}
function tickTasks(){
  const now = state.real.seconds;
  const remaining = [];
  state.tasks.forEach(t=>{
    if(t.endAt <= now){ sndTaskDone(); t.onComplete && t.onComplete(); }
    else remaining.push(t);
  });
  state.tasks = remaining;
}

/* ---------------------------------------------------------------------- */
/* TEXT MATCHING ENGINE (Acionamento / VCFS apenas — auto-coaching)          */
/* ---------------------------------------------------------------------- */
const STOPWORDS = new Set(['a','o','os','as','de','da','do','das','dos','e','um','uma','uns','umas','pra','para','no','na','nos','nas','se','que','eu','vou','ta','to','tá','tô','com','em','ao','aos','à','às','ja','já','the']);

function normalize(s){
  return (s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^\w\s]/g,' ').replace(/\s+/g,' ').trim();
}
function meaningfulWords(s){
  return normalize(s).split(' ').filter(w=>w && !STOPWORDS.has(w));
}
function wordFuzzyMatch(a,b){
  if(a===b) return true;
  if(a.length>=4 && b.length>=4 && (a.startsWith(b) || b.startsWith(a))) return true;
  return false;
}
function intentScore(text, intent){
  const words = meaningfulWords(text);
  let best = 0;
  (intent.keywords||[]).forEach(kw=>{
    const kwWords = meaningfulWords(kw);
    if(kwWords.length===0) return;
    const hits = kwWords.filter(kwW => words.some(w=>wordFuzzyMatch(w,kwW))).length;
    const ratio = hits/kwWords.length;
    if(ratio>best) best=ratio;
  });
  return best;
}
function exampleFor(intent){
  // auto-derivado da própria keyword — garante que o exemplo sempre bate
  const kw = intent.keywords[0];
  return `"Central, ${kw}."`;
}
function resolveIntent(text, intents){
  let matched=null, bestPartial=null, bestScore=0;
  intents.forEach(intent=>{
    const score = intentScore(text, intent);
    if(score>=0.999){ if(!matched) matched=intent; }
    else if(score>bestScore){ bestScore=score; bestPartial=intent; }
  });
  if(matched) return {type:'match', intent:matched};
  if(bestPartial && bestScore>=0.4) return {type:'close', intent:bestPartial, score:bestScore};
  return {type:'none'};
}

function createChatPanel({ logKey, contacts, getIntents, onMatch, fallbackText, placeholder }){
  if(!state.chatLogs[logKey]) state.chatLogs[logKey] = {};
  contacts.forEach(c=>{ if(!state.chatLogs[logKey][c.id]) state.chatLogs[logKey][c.id]=[]; });
  let activeContact = contacts[0].id;

  const wrap = document.createElement('div');
  wrap.className = 'chatpanel';

  let tabsEl = null;
  if(contacts.length>1){
    tabsEl = document.createElement('div'); tabsEl.className='chat-tabs';
    contacts.forEach(c=>{
      const t = document.createElement('button');
      t.className='chat-tab' + (c.id===activeContact?' active':'');
      t.textContent = c.name;
      t.addEventListener('click', ()=>{ activeContact=c.id; syncTabs(); renderMessages(); input.focus(); });
      tabsEl.appendChild(t);
    });
    wrap.appendChild(tabsEl);
  }
  function syncTabs(){
    if(!tabsEl) return;
    [...tabsEl.children].forEach((t,i)=> t.classList.toggle('active', contacts[i].id===activeContact));
  }

  const body = document.createElement('div'); body.className='chat-body';
  wrap.appendChild(body);

  function renderMessages(){
    body.innerHTML='';
    const msgs = state.chatLogs[logKey][activeContact];
    if(msgs.length===0){
      const c = contacts.find(x=>x.id===activeContact);
      const hint = document.createElement('div'); hint.className='chat-empty';
      hint.textContent = c.emptyHint || 'Envie uma mensagem para iniciar a comunicação.';
      body.appendChild(hint);
    }
    msgs.forEach(m=>{
      const b = document.createElement('div');
      b.className = 'chat-msg ' + (m.from==='user'?'out':'in');
      b.innerHTML = `<div class="bubble${m.coach?' coach':''}">${m.text}</div>`;
      body.appendChild(b);
    });
    body.scrollTop = body.scrollHeight;
  }
  renderMessages();

  const inputRow = document.createElement('div'); inputRow.className='chat-inputrow';
  const input = document.createElement('input');
  input.type='text'; input.className='chat-input';
  input.placeholder = placeholder || 'Digite sua mensagem...';
  const sendBtn = document.createElement('button');
  sendBtn.className='chat-send'; sendBtn.innerHTML='&#10148;'; sendBtn.type='button';
  inputRow.appendChild(input); inputRow.appendChild(sendBtn);
  wrap.appendChild(inputRow);

  function send(){
    const text = input.value.trim();
    if(!text) return;
    input.value='';
    state.chatLogs[logKey][activeContact].push({from:'user', text});
    renderMessages();
    sndSend();
    const intents = getIntents(activeContact);
    const res = resolveIntent(text, intents);
    input.disabled = true; sendBtn.disabled = true;
    const typingEl = document.createElement('div');
    typingEl.className = 'chat-msg in';
    typingEl.innerHTML = `<div class="bubble typing-bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>`;
    body.appendChild(typingEl);
    body.scrollTop = body.scrollHeight;
    setTimeout(()=>{
      typingEl.remove();
      if(res.type==='match'){
        const intent = res.intent;
        const replyText = typeof intent.reply === 'function' ? intent.reply() : intent.reply;
        state.chatLogs[logKey][activeContact].push({from:'system', text: replyText});
        onMatch(intent, activeContact);
      } else if(res.type==='close'){
        const intent = res.intent;
        const coachText = `Central: Não entendi ao certo. Se a intenção é sobre "${intent.label}", tente algo como: <em>${exampleFor(intent)}</em>`;
        state.chatLogs[logKey][activeContact].push({from:'system', text: coachText, coach:true});
      } else {
        const fb = typeof fallbackText==='function' ? fallbackText(activeContact) : fallbackText;
        state.chatLogs[logKey][activeContact].push({from:'system', text: fb});
      }
      renderMessages();
      sndReceive();
      input.disabled = false; sendBtn.disabled = false;
      input.focus();
    }, 650);
  }
  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });

  return { el: wrap, refresh: renderMessages, focus:()=>input.focus() };
}

function renderCroqui(mountEl, opts){
  opts = opts || {};
  mountEl.innerHTML = croquiBaseSVG(opts.sectors);
  const svg = mountEl.querySelector('svg');
  const markersG = svg.querySelector('#croquiMarkers');
  let markup = '';
  if(opts.showJovem) markup += croquiMarkerSVG(290,350,'#e0a53c','JOVEM','jovem', !!opts.onJovemClick);
  if(opts.showMenina) markup += croquiMarkerSVG(300,235,'#5c9a5a','MENINA','menina', !!opts.onVictimClick);
  if(opts.showMae) markup += croquiMarkerSVG(395,175,'#d42c2c','MÃE','mae', !!opts.onVictimClick);
  if(opts.marks && opts.marks.fuga){
    const p = opts.marks.fuga;
    markup += `<g transform="translate(${p.x},${p.y})">
      <polygon points="0,-11 10,8 -10,8" fill="#5c9a5a" stroke="#0b0c0d" stroke-width="1.5"/>
      <text y="-16" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#5c9a5a">ROTA DE FUGA</text>
    </g>`;
  }
  if(opts.marks && opts.marks.segura){
    const p = opts.marks.segura;
    markup += `<g transform="translate(${p.x},${p.y})">
      <rect x="-9" y="-9" width="18" height="18" fill="#e0a53c" stroke="#0b0c0d" stroke-width="1.5" transform="rotate(45)"/>
      <text y="-18" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="9" fill="#e0a53c">ZONA SEGURA</text>
    </g>`;
  }
  markersG.innerHTML = markup;

  if(opts.onJovemClick){
    const jov = svg.querySelector('[data-marker="jovem"]');
    if(jov) jov.addEventListener('click', (e)=>{ e.stopPropagation(); opts.onJovemClick(); });
  }
  if(opts.onVictimClick){
    ['menina','mae'].forEach(id=>{
      const el = svg.querySelector(`[data-marker="${id}"]`);
      if(el) el.addEventListener('click', (e)=>{ e.stopPropagation(); opts.onVictimClick(id); });
    });
  }
  if(opts.sectors && opts.onSectorClick){
    svg.querySelectorAll('.croqui-sector').forEach(el=>{
      el.style.pointerEvents = 'all';
      el.addEventListener('click', (e)=>{ e.stopPropagation(); opts.onSectorClick(el.dataset.sector); });
    });
  }
  if(opts.interactive){
    const surface = svg.querySelector('#croquiClickSurface');
    surface.style.cursor = 'crosshair';
    surface.style.pointerEvents = 'all';
    surface.addEventListener('click', (e)=>{
      const rect = svg.getBoundingClientRect();
      const scaleX = 700/rect.width, scaleY = 460/rect.height;
      const x = (e.clientX-rect.left)*scaleX;
      const y = (e.clientY-rect.top)*scaleY;
      opts.interactive.onPlace(x,y);
    });
  }
  return svg;
}

function marcarMaeEncontrada(origem){
  state.vitimas.mae.found = true;
  state.vitimas.mae.foundAt = state.real.seconds;
  if(state.jovem.team==='cerd'){
    state.vitimas.mae.preDeceased = true;
    logEvent('Fase 4 — Gerenciamento de Vítimas', `CONSEQUÊNCIA GRAVE: ${origem} localiza a mãe em óbito — a equipe CERD estava empenhada na extração do jovem no momento crítico e não pôde priorizá-la a tempo.`);
  } else {
    logEvent('Fase 4 — Gerenciamento de Vítimas', `${origem} confirma: a mãe é encontrada com os membros inferiores presos entre a cama e uma laje — possível síndrome de esmagamento.`);
  }
}
function marcarMeninaEncontrada(origem){
  state.vitimas.menina.found = true;
  state.vitimas.menina.foundAt = state.real.seconds;
  logEvent('Fase 4 — Gerenciamento de Vítimas', `${origem} confirma: a menina de 12 anos é encontrada consciente, em célula de sobrevivência estável.`);
}
function performK9Sweep(onComplete){
  scheduleTask({
    militarIds: [], seconds: 15, label:'Varredura K9',
    onComplete:()=>{
      state.recursos.k9.areaLimpa = true;
      Object.keys(state.setores).forEach(sid=>{
        const s = state.setores[sid];
        const vk = SETOR_VICTIM[sid];
        s.visited = true;
        if(vk && !s.secondaryDone){
          s.secondaryDone = true;
          const origem = 'Varredura K9 (Lenke e Alex)';
          if(vk==='mae') marcarMaeEncontrada(origem);
          else marcarMeninaEncontrada(origem);
        }
      });
      logEvent('Fase 4 — Gerenciamento de Vítimas', 'Equipe K9 concluiu a varredura completa — área confirmada limpa.');
      renderK9TimerFloat();
      if(onComplete) onComplete();
    }
  });
  logEvent('Fase 4 — Gerenciamento de Vítimas', 'Equipe K9 iniciou varredura completa de todas as áreas.');
}

/* PENDÊNCIAS (relatório final)                                              */
/* ---------------------------------------------------------------------- */
function computePendencias(){
  const p = [];
  const acCount = Object.keys(state.acionamento.matched).length;
  const acMissing = [];
  CIODES_INTENTS.concat(ADAIR_INTENTS).forEach(i=>{ if(!state.acionamento.matched[i.id]) acMissing.push(i.label); });
  if(acMissing.length) p.push({sev:'mild', text:`Acionamento — informações não solicitadas: ${acMissing.join('; ')}.`});

  const rec = state.reconhecimento;
  const recMissing = [];
  if(!rec.oficial) recMissing.push('Oficial de Segurança não designado');
  if(!rec.recon) recMissing.push('Reconhecimento 360° não realizado');
  if(!rec.energia) recMissing.push('Rede elétrica não desligada');
  if(!rec.atm) recMissing.push('Avaliação atmosférica não realizada');
  if(!rec.isolamento) recMissing.push('Área não isolada');
  if(!rec.escoramento) recMissing.push('Escoramento preventivo não realizado');
  if(recMissing.length) p.push({sev:'grave', text:`Reconhecimento — ações não realizadas: ${recMissing.join('; ')}.`});

  const seg = state.seguranca;
  const segMissing = [];
  if(!seg.vigia) segMissing.push('Vigia');
  if(!seg.comunicacao) segMissing.push('Comunicação');
  if(!seg.fuga) segMissing.push('Rota de Fuga');
  if(!seg.segura) segMissing.push('Rota Segura');
  if(segMissing.length) p.push({sev:'grave', text:`Plano de Segurança (VCFS) — itens não comunicados: ${segMissing.join(', ')}.`});

  const setoresPendentes = state.recursos.k9.areaLimpa ? 0 : Object.keys(state.setores).filter(sid=>{
    const s = state.setores[sid];
    const hasVictim = !!SETOR_VICTIM[sid];
    return hasVictim ? !s.secondaryDone : !s.visited;
  }).length;
  if(setoresPendentes>0) p.push({sev:'grave', text:`Gerenciamento de Vítimas — ${setoresPendentes} setor(es) não tiveram a busca concluída.`});
  if(!state.jovem.delegado) p.push({sev:'grave', text:'Gerenciamento de Vítimas — extração do jovem nunca foi delegada a nenhuma equipe.'});

  return p;
}

function withMetaIntent(baseIntents, contactLabel){
  return baseIntents.concat([{
    id:'__mais__', label:'Mais informações disponíveis',
    keywords:['mais informacoes','tem mais alguma coisa','algo mais que eu deveria saber','mais alguma informacao','tem mais detalhes','o que mais vc sabe','tem algo mais'],
    reply: ()=>{
      const faltam = baseIntents.filter(i=>!state.acionamento.matched[i.id]);
      if(faltam.length===0) return `${contactLabel}: Já passei tudo que sei sobre a ocorrência.`;
      return `${contactLabel}: Ainda posso falar sobre: ${faltam.map(i=>i.label).join('; ')}.`;
    }
  }]);
}

  const fields = ['regData','regChefe','regCondutor','regOp1','regOp2','regOp3','regOp4'];
  const startBtn = document.getElementById('startBtn');
  const hint = document.getElementById('regHint');

  document.querySelectorAll('.team-opt').forEach(opt=>{
    opt.addEventListener('click', ()=>{
      document.querySelectorAll('.team-opt').forEach(o=>o.classList.remove('sel'));
      opt.classList.add('sel');
      state.equipe.letra = opt.dataset.t;
      checkReady();
    });
  });
  fields.forEach(id=>{
    document.getElementById(id).addEventListener('input', ()=>{
      document.getElementById(id).classList.toggle('filled', document.getElementById(id).value.trim().length>0);
      checkReady();
    });
  });

  function checkReady(){
    const data = document.getElementById('regData').value;
    const chefe = document.getElementById('regChefe').value.trim();
    const condutor = document.getElementById('regCondutor').value.trim();
    const op1 = document.getElementById('regOp1').value.trim();
    const ready = state.equipe.letra && data && chefe && condutor && op1;
    startBtn.disabled = !ready;
    hint.textContent = ready ? 'Tudo pronto. Pode iniciar a ocorrência.' : 'Preencha Equipe, Data, Chefe, Condutor e ao menos o Operador 1 para iniciar.';
    hint.style.color = ready ? '#5c9a5a' : '';
  }

  startBtn.addEventListener('click', ()=>{
    state.equipe.data = document.getElementById('regData').value;
    state.equipe.chefe = document.getElementById('regChefe').value.trim();
    state.equipe.condutor = document.getElementById('regCondutor').value.trim();
    state.equipe.operadores = [
      document.getElementById('regOp1').value.trim(),
      document.getElementById('regOp2').value.trim(),
      document.getElementById('regOp3').value.trim(),
      document.getElementById('regOp4').value.trim(),
    ];
    buildMilitares();
    state.started = true;
    startRealTimer();
    goPhase(0);
  });
}

function renderAcionamento(view){
  const panel = panelShell(view, 'Fase 01 — Rádio Operador CIODES', 'Acionamento');
  panel.innerHTML += `<p>A guarnição é acionada para uma ocorrência de <strong>desabamento com possíveis vítimas</strong>. Use o rádio abaixo para <strong>perguntar</strong> ao CIODES e ao solicitante — as informações só chegam mediante pergunta, como em uma ocorrência real. Pode perguntar "tem mais informações?" a qualquer momento.</p>`;

  const chat = createChatPanel({
    logKey:'acionamento',
    contacts:[
      {id:'ciodes', name:'CIODES', emptyHint:'Envie uma pergunta ao CIODES sobre a ocorrência.'},
      {id:'adair', name:'Adair (Solicitante)', emptyHint:'Envie uma pergunta ao solicitante no local.'},
    ],
    getIntents: (contactId)=> contactId==='ciodes' ? withMetaIntent(CIODES_INTENTS,'CIODES') : withMetaIntent(ADAIR_INTENTS,'Adair'),
    fallbackText: (contactId)=> contactId==='ciodes'
      ? 'CIODES: Não localizei essa informação no momento. Tente reformular a pergunta.'
      : '"Não sei te dizer não, desculpa."',
    placeholder:'Digite sua pergunta e pressione Enter...',
    onMatch:(intent)=>{
      if(intent.id!=='__mais__' && !state.acionamento.matched[intent.id]){
        state.acionamento.matched[intent.id] = true;
        updateGate();
      }
    }
  });
  panel.appendChild(chat.el);

  const matchedCount = ()=> Object.keys(state.acionamento.matched).length;
  let footer = footerNav(panel, {
    gateNote:`${matchedCount()}/10 informações levantadas.`,
    onNext:()=>{
      logEvent('Fase 1 — Acionamento', `A guarnição levantou ${matchedCount()} de 10 informações possíveis antes de se deslocar.`);
      goPhase(1);
    }
  });
  function updateGate(){
    footer.remove();
    footer = footerNav(panel, {
      gateNote:`${matchedCount()}/10 informações levantadas.`,
      onNext:()=>{
        logEvent('Fase 1 — Acionamento', `A guarnição levantou ${matchedCount()} de 10 informações possíveis antes de se deslocar.`);
        goPhase(1);
      }
    });
  }
  chat.focus();
}
